<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100d25">
<title>REACTOR 2.9 · MIAMI AFTER DARK</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--paper:#fff2fa;--mint:#78f9e5;--pink:#ff80c2;--gold:#ffd48a;--edge:#ba8fcb48}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d25;color:var(--paper);font-family:system-ui,Arial,sans-serif;touch-action:none}
button{font:inherit;cursor:pointer}
#game{position:fixed;inset:0;width:100vw;height:100dvh}
#hud,#bottom{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));max-width:560px;margin-inline:auto}
#hud{top:calc(10px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--edge);border-radius:15px;background:linear-gradient(115deg,#221330f5,#11162bea);pointer-events:none}
.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(17px,4.6vw,25px);line-height:1.05}
.brand span{color:var(--pink);font-size:.64em;vertical-align:middle}
.subtitle,.stat-label,.meter-label{font-size:9px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.subtitle{margin-top:4px;color:var(--mint)}
.stats{display:flex;gap:12px;text-align:right;align-items:end}
.stat-label{display:block;color:#c6b7d1}
#score,#best{display:block;font-variant-numeric:tabular-nums;font-weight:850}
#score{font-size:clamp(17px,4.5vw,25px);line-height:1}
#best{font-size:12px;color:var(--gold)}
#combo,#toast{position:fixed;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 8px #100819,0 0 12px #181024;font-weight:900}
#combo{top:calc(72px + env(safe-area-inset-top));font-size:13px;color:var(--mint);letter-spacing:.15em;line-height:20px}
#toast{bottom:calc(96px + env(safe-area-inset-bottom));padding:0 10px;color:#fff2fa;font-size:clamp(16px,4.6vw,26px);font-style:italic;opacity:0;transition:opacity .16s;z-index:2}
#toast.show{opacity:1}
#toast[data-effect="chain"]{color:var(--mint)}
#toast[data-effect="critical"]{color:#ff9bb7}
#toast[data-effect="super"],#toast[data-effect="mega"]{color:var(--gold);text-shadow:0 0 16px #ff408c,0 2px 6px #190f32}
#toast[data-effect="mega"].announce{animation:mega-pop .36s ease-out}
@keyframes mega-pop{0%{transform:scale(.72)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
#bottom{bottom:calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:7px 11px;align-items:center;padding:9px 11px;border:1px solid var(--edge);border-radius:15px;background:linear-gradient(120deg,#291632f7,#10172cf7)}
.meter-label{display:flex;justify-content:space-between;gap:4px;margin-bottom:4px;letter-spacing:.08em}
#epct,#pct{color:var(--mint);white-space:nowrap}
#pct[data-critical="true"]{color:#ff93ad}
.bar{height:7px;border:1px solid #c3ace33d;border-radius:20px;background:#0a0c19;overflow:hidden}
.bar>div{height:100%;width:0;transition:width .15s;border-radius:inherit}
.pressure{background:linear-gradient(90deg,#43e7d5,#ffd06d,#ff658e)}
.energy{background:linear-gradient(90deg,#64ecd5,#a98bff,#ff91c7)}
#overdrive-status[data-state="active"]{text-shadow:0 0 10px #94ffe491}
#overdrive-status[data-state="recovery"] #epct{color:#e0baff}
#mute{grid-column:2;grid-row:1/3;width:44px;height:44px;border-radius:12px;border:1px solid #f39aca79;background:#492349;color:#fff0f9;font-size:20px}
#mute[aria-pressed="true"]{color:#d6a9c6;background:#292039}
#overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#0b0a207a}
#overlay[hidden]{display:none}
#panel{width:min(100%,390px);padding:23px;border:1px solid #f79dc398;border-radius:23px;background:linear-gradient(143deg,#342245f5,#141029fa 66%);box-shadow:0 14px 60px #0e071fbf,0 0 25px #f483bb39;text-align:center}
.eyebrow{color:var(--mint);font-size:10px;font-weight:850;letter-spacing:.22em;margin-bottom:8px}
#panel h1{margin:0;font-size:clamp(27px,9vw,53px);line-height:.98;font-weight:950;font-style:italic;letter-spacing:-.025em;text-shadow:0 0 22px #ff70c073}
#panel h1 span{display:block;color:var(--pink)}
#panel p{font-size:13px;line-height:1.5;color:#e8d5e7;margin:14px 0}
#panel button{min-height:46px;padding:9px 25px;border:0;border-radius:12px;background:linear-gradient(115deg,#ffda92,#ff85c3);color:#27152c;font-weight:900;letter-spacing:.09em}
.results{display:flex;justify-content:center;gap:26px;margin:17px 0}
.results strong{display:block;color:var(--gold);font-size:24px;font-variant-numeric:tabular-nums}
@media(max-width:360px){.stats{gap:6px}.brand{font-size:16px}#hud{padding-inline:9px}}
@media(max-height:480px){#panel{padding:12px 18px}#panel h1{font-size:27px}#panel p{margin:6px 0}#combo{top:calc(62px + env(safe-area-inset-top))}#toast{bottom:calc(81px + env(safe-area-inset-bottom))}}
@media (min-width:760px) and (max-height:500px) and (orientation:landscape){
  #hud{width:156px;right:auto;top:calc(14px + env(safe-area-inset-top));grid-template-columns:1fr;gap:8px}
  .stats{text-align:left}
  #bottom{width:156px;left:auto;bottom:calc(12px + env(safe-area-inset-bottom));grid-template-columns:1fr;padding:8px}
  #mute{grid-column:1;grid-row:3;justify-self:end}
  #combo{right:auto;width:156px;top:113px}
  #toast{left:auto;width:172px;bottom:148px;font-size:16px}
}
</style>
</head>
<body>
<div id="game"></div>
<header id="hud">
  <div><div class="brand">REACTOR <span>2.9</span></div><div class="subtitle">Miami After Dark</div></div>
  <div class="stats"><div><span class="stat-label">Score</span><strong id="score">0</strong></div><div><span class="stat-label">Record</span><strong id="best">0</strong></div></div>
</header>
<div id="combo"></div><div id="toast"></div>
<div id="bottom">
  <div><div class="meter-label">Pression <span id="pct">10%</span></div><div class="bar"><div id="pfill" class="pressure"></div></div></div>
  <button id="mute" aria-label="Couper ou rétablir le son" aria-pressed="false">♫</button>
  <div id="overdrive-status" data-state="charge"><div class="meter-label">Overdrive <span id="epct">Recharge · 0%</span></div><div class="bar"><div id="efill" class="energy"></div></div></div>
</div>
<div id="overlay"><div id="panel">
  <div class="eyebrow">REACTOR 2.9 · MIAMI 1986</div><h1>MIAMI <span>AFTER DARK</span></h1>
  <p>Touche un groupe de deux cristaux ou plus. Les grands groupes réduisent la pression. Enchaîne les coups pour charger OVERDRIVE.</p>
  <button id="start">JOUER</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
(()=>{'use strict';
const N=7,C=[0x39f6e0,0xff65ad,0xffd369,0xa68bff];
const $=id=>document.getElementById(id),rand=()=>Math.floor(Math.random()*C.length);
const OVERDRIVE_MS=9000, RECOVERY_MS=12000, COMBO_MS=2100;
const DISTURBANCE_MS=45000, CHAIN_MIN=4, MAX_CHAIN_WAVES=2;
const PRESSURE_BY_SIZE=[0,0,6,3,1,-3,-6];
const MAX_PARTICLES=80, FALL_MS=115;
let board=[],score=0,pressure=10,energy=0,combo=0,lastMove=-Infinity;
let qualityMoves=0,comboTier=0,critical=false;
let elapsed=0,nextDisturbance=DISTURBANCE_MS,overUntil=0,recoverUntil=0,settleEvent=null;
let playing=false,busy=false,muted=false,scene=null,audio=null,musicClock=null,best=0,toastTimer=0;
try{best=Number(localStorage.getItem('reactor_miami_best')||0)}catch(e){}
const STEP=60/120/4;
const CHORDS=[[45,57,60,64,67],[41,53,57,60,64],[48,55,60,64,67],[43,55,59,62,69]];
const LEAD=[64,67,69,72,69,67,64,62,60,64,67,69,67,64,62,60];
let master,musicBus,drumNoise,musicStep=0,nextNote=0;
const hz=note=>440*2**((note-69)/12);

function synth(frequency,when,duration,type,volume,bus,filterHz=0,endFrequency=0){
  const oscillator=audio.createOscillator();
  const gain=audio.createGain();
  oscillator.type=type;
  oscillator.frequency.setValueAtTime(frequency,when);
  if(endFrequency)oscillator.frequency.exponentialRampToValueAtTime(endFrequency,when+duration*.8);
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(volume,when+Math.min(.022,duration*.25));
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  if(filterHz){
    const filter=audio.createBiquadFilter();
    filter.type='lowpass';
    filter.frequency.value=filterHz;
    oscillator.connect(filter).connect(gain);
  }else oscillator.connect(gain);
  gain.connect(bus);
  oscillator.start(when);
  oscillator.stop(when+duration+.01);
}
function sound(frequency,duration=.14,type='triangle',volume=.035,offset=0){
  if(!audio||muted||audio.state!=='running')return;
  synth(frequency,audio.currentTime+.004+offset,duration,type,volume,master);
}
function noiseHit(when,duration,frequency,volume){
  const source=audio.createBufferSource();
  const filter=audio.createBiquadFilter();
  const gain=audio.createGain();
  source.buffer=drumNoise;
  filter.type='highpass';
  filter.frequency.value=frequency;
  gain.gain.setValueAtTime(volume,when);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  source.connect(filter).connect(gain).connect(musicBus);
  source.start(when);
  source.stop(when+duration+.01);
}
function arrangeStep(step,when){
  const bar=Math.floor(step/16)%CHORDS.length, beat=step%16;
  const [root,...chord]=CHORDS[bar];
  const active=elapsed<overUntil;
  if(beat===0){
    for(const note of chord)synth(hz(note),when,1.65,'triangle',.020,musicBus,1250);
  }
  if(beat%4===0)synth(113,when,.17,'sine',.17,musicBus,0,46);
  if(beat===4||beat===12){
    noiseHit(when,.13,1250,.049);
    synth(174,when,.08,'triangle',.027,musicBus,0,105);
  }
  if(beat%2===0)noiseHit(when+.009,beat%4===2?.068:.033,6700,beat%4===2?.024:.012);
  if([0,3,6,8,10,14].includes(beat)){
    const note=root-12+(beat===6?7:beat===14?12:0);
    synth(hz(note),when,.22,'sawtooth',.086,musicBus,390);
  }
  if(beat%4===0){
    const note=LEAD[bar*4+beat/4];
    synth(hz(note),when,.31,'triangle',.059,musicBus,2150);
    synth(hz(note),when+.185,.25,'sine',.014,musicBus);
  }
  if(active&&beat%2===1){
    const note=chord[(beat>>1)%chord.length]+12;
    synth(hz(note),when,.19,'triangle',.033,musicBus,3200);
  }
}
function scheduleMusic(){
  if(!playing||audio.state!=='running')return;
  const now=audio.currentTime;
  if(nextNote<now)nextNote=now+.012;
  while(nextNote<now+.09){
    arrangeStep(musicStep++,nextNote);
    nextNote+=STEP;
  }
}
function syncAudio(){
  if(!audio)return;
  master.gain.setTargetAtTime(muted?0:.78,audio.currentTime,.025);
}
function music(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  if(!audio){
    audio=new Audio();
    master=audio.createGain();
    musicBus=audio.createGain();
    musicBus.gain.value=0;
    const limiter=audio.createDynamicsCompressor();
    limiter.threshold.value=-12;
    limiter.ratio.value=4;
    musicBus.connect(master).connect(limiter).connect(audio.destination);
    drumNoise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.18),audio.sampleRate);
    const samples=drumNoise.getChannelData(0);
    let seed=27183;
    for(let i=0;i<samples.length;i++){
      seed=(Math.imul(seed,1664525)+1013904223)>>>0;
      samples[i]=seed/2147483648-1;
    }
    musicClock=setInterval(scheduleMusic,25);
  }
  syncAudio();
  musicBus.gain.setTargetAtTime(1,audio.currentTime,.045);
  if(audio.state!=='running')audio.resume().catch(()=>{});
}
function stopMusic(){
  if(musicBus)musicBus.gain.setTargetAtTime(0,audio.currentTime,.075);
}
function updateHud(){
  const active=elapsed<overUntil;
  const remaining=Math.ceil((recoverUntil-elapsed)/1000);
  $('score').textContent=score.toLocaleString('fr-FR');
  $('best').textContent=best.toLocaleString('fr-FR');
  $('pct').textContent=Math.floor(pressure)+'%';
  $('pct').dataset.critical=String(critical);
  $('pfill').style.width=pressure+'%';
  $('overdrive-status').dataset.state=active?'active':remaining>0?'recovery':'charge';
  $('epct').textContent=active?'ACTIF ×3':remaining>0?'RÉCUPÉRATION · '+remaining+' s':'RECHARGE · '+energy+'%';
  $('efill').style.width=energy+'%';
  $('combo').textContent=combo>1?'COMBO ×'+combo:'';
}
function flash(message,style=""){
  const toast=$('toast');
  toast.textContent=message;
  toast.dataset.effect=style;
  toast.classList.remove('announce');
  if(style==='mega'){
    void toast.offsetWidth;
    toast.classList.add('announce');
  }
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),700);
}
function cue(kind){
  const cues={
    clear:[330,.09,'triangle',.034], large:[523,.17,'triangle',.056],
    combo:[659,.13,'sine',.048], super:[784,.21,'triangle',.06],
    mega:[1047,.34,'sawtooth',.048], chain:[880,.16,'triangle',.048],
    overdrive:[659,.4,'sawtooth',.05], critical:[185,.26,'square',.029],
    defeat:[98,.55,'sawtooth',.045]
  };
  sound(...cues[kind]);
  if(kind==="super"||kind==="mega"){
    sound(988,.22,"triangle",.035,.065);
    if(kind==="mega")sound(1319,.32,"sine",.036,.13);
  }
  if(kind==="defeat"){
    sound(196,.38,"triangle",.055,.04);
    sound(146.83,.52,"sine",.052,.13);
    sound(98,.65,"sine",.052,.24);
  }
}
function chargeOverdrive(amount){
  if(elapsed<recoverUntil)return;
  energy=Math.min(100,energy+amount);
  if(energy<100)return;
  energy=0;
  overUntil=elapsed+OVERDRIVE_MS;
  recoverUntil=overUntil+RECOVERY_MS;
  flash('⚡ OVERDRIVE!');
  cue('overdrive');
}
function makeCrystalTextures(game){
  const graphics=game.make.graphics({x:0,y:0,add:false});
  const outline=[{x:32,y:4},{x:55,y:19},{x:59,y:39},{x:45,y:58},{x:19,y:58},{x:5,y:39},{x:9,y:19}];
  const facet=(color,alpha,points)=>{
    graphics.fillStyle(color,alpha);
    graphics.fillPoints(points,true);
  };
  C.forEach((color,index)=>{
    graphics.clear();
    graphics.fillStyle(color,.18);
    graphics.fillCircle(32,33,31);
    facet(0x130e2e,1,outline.map(({x,y})=>({x,y:y+3})));
    facet(color,1,outline);
    const center={x:31,y:29};
    facet(0xffffff,.52,[outline[0],outline[1],center,outline[6]]);
    facet(0xffffff,.21,[outline[6],center,outline[5]]);
    facet(0x151235,.31,[outline[1],outline[2],outline[3],center]);
    facet(0x151235,.53,[outline[3],outline[4],center]);
    graphics.lineStyle(1.7,0xfff4ff,.73);
    graphics.strokePoints(outline,true,true);
    graphics.lineStyle(1.6,0xffffff,.58);
    graphics.lineBetween(32,8,31,29);
    graphics.lineBetween(12,20,27,14);
    facet(0xffffff,.8,[{x:32,y:6},{x:36,y:11},{x:32,y:16},{x:29,y:11}]);
    facet(0x1f133a,.52,[outline[4],outline[5],{x:26,y:44},center]);
    graphics.lineStyle(.9,0xece4ff,.55);
    graphics.lineBetween(44,53,54,38);
    graphics.generateTexture('crystal-'+index,64,64);
  });
  graphics.destroy();
}
function paintBoard(moved=[]){
  if(!scene||!board.length)return;
  const {cell,left,top,gems,boardFrame}=scene;
  boardFrame.clear();
  boardFrame.fillStyle(0x080817,.62);
  boardFrame.fillRoundedRect(left-10,top-8,cell*N+20,cell*N+22,16);
  boardFrame.fillStyle(0x14112c,.84);
  boardFrame.fillRoundedRect(left-7,top-7,cell*N+14,cell*N+14,14);
  boardFrame.lineStyle(4,0xff73ba,.17);
  boardFrame.strokeRoundedRect(left-8,top-8,cell*N+16,cell*N+16,15);
  boardFrame.lineStyle(1.4,0xddc7ff,.64);
  boardFrame.strokeRoundedRect(left-7,top-7,cell*N+14,cell*N+14,14);
  const origins=new Map(moved.map(([x,y,from])=>[y*N+x,from]));
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const index=y*N+x, gem=gems[index];
    const targetY=top+(y+.5)*cell;
    const from=origins.get(index);
    scene.tweens.killTweensOf(gem);
    boardFrame.fillStyle(0x17152e,(x+y)%2?.75:.53);
    boardFrame.fillRoundedRect(left+x*cell+1,top+y*cell+1,cell-2,cell-2,5);
    gem.setTexture('crystal-'+board[y][x]).setDisplaySize(cell*.91,cell*.91);
    gem.setPosition(left+(x+.5)*cell,from===undefined?targetY:top+(Math.max(-.35,from)+.5)*cell);
    gem.setVisible(true).setAlpha(from<0?.3:1);
    if(from!==undefined)scene.tweens.add({targets:gem,y:targetY,alpha:1,duration:FALL_MS,ease:'Cubic.Out'});
  }
}
function burst(cells,color,intensity){
  const {cell,left,top,particles}=scene;
  let cursor=0;
  for(const [x,y] of cells){
    for(let i=0;i<intensity+2;i++){
      while(cursor<particles.length&&particles[cursor].visible)cursor++;
      if(cursor===particles.length)return;
      const p=particles[cursor++];
      const angle=Math.random()*Math.PI*2;
      const distance=cell*(.28+Math.random()*.66);
      const cx=left+(x+.5)*cell,cy=top+(y+.5)*cell;
      p.setPosition(cx,cy).setFillStyle(color).setAlpha(1)
        .setScale(.65+Math.random(),i===0?1.65:.85).setRotation(angle).setVisible(true);
      scene.tweens.add({targets:p,x:cx+Math.cos(angle)*distance,y:cy+Math.sin(angle)*distance,
        alpha:0,scale:0,duration:150+Math.random()*110,onComplete:()=>p.setVisible(false)});
    }
  }
}
function clearEffects(){
  for(const item of [...scene.particles,...scene.gems])scene.tweens.killTweensOf(item);
  for(const item of scene.particles)item.setVisible(false);
  scene.cameras.main.resetFX();
}
function start(){
  board=Array.from({length:N},()=>Array.from({length:N},rand));
  score=0;
  pressure=10;
  energy=0;
  combo=0;
  qualityMoves=0;
  comboTier=0;
  critical=false;
  lastMove=-Infinity;
  elapsed=0;
  nextDisturbance=DISTURBANCE_MS;
  overUntil=0;
  recoverUntil=0;
  musicStep=0;
  nextNote=0;
  playing=true;
  busy=false;
  updateHud();
  paintBoard();
  music();
}
function award(points){
  score+=points*(elapsed<overUntil?3:1);
  if(score<=best)return;
  best=score;
  try{localStorage.setItem('reactor_miami_best',String(best))}catch(e){}
}
function finish(){
  playing=false;
  busy=false;
  stopMusic();
  cue('defeat');
  clearEffects();
  overUntil=0;
  recoverUntil=0;
  if(settleEvent)settleEvent.remove();
  settleEvent=null;
  clearTimeout(toastTimer);
  $('toast').classList.remove('show');
  updateHud();
  $('panel').innerHTML='<div class="eyebrow">MIAMI AFTER DARK</div><h1>RÉACTEUR <span>CRITIQUE</span></h1><div class="results"><div><span class="stat-label">Score</span><strong>'+score.toLocaleString('fr-FR')+'</strong></div><div><span class="stat-label">Record</span><strong>'+best.toLocaleString('fr-FR')+'</strong></div></div><button id="again">REJOUER</button>';
  $('overlay').hidden=false;
  $('again').onclick=()=>{$('overlay').hidden=true;start()};
}
function changePressure(amount){
  pressure=Math.max(0,Math.min(100,pressure+amount));
  if(pressure===100){
    finish();
    return;
  }
  if(pressure>=82&&!critical){
    critical=true;
    cue('critical');
    flash('PRESSION CRITIQUE','critical');
  }
  if(pressure<74)critical=false;
}
function findGroup(x,y,seen){
  const color=board[y][x], stack=[[x,y]], group=[];
  while(stack.length){
    const [a,b]=stack.pop(), key=b*N+a;
    if(a<0||a>=N||b<0||b>=N||seen.has(key)||board[b][a]!==color)continue;
    seen.add(key);
    group.push([a,b]);
    stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
  }
  return group;
}
// Label the connected components before each wave. Labels fall with their crystals.
function labelComponents(){
  const labels=Array.from({length:N},()=>Array(N).fill(0));
  const seen=new Set();
  let label=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(seen.has(y*N+x))continue;
    label++;
    for(const [a,b] of findGroup(x,y,seen))labels[b][a]=label;
  }
  return labels;
}
function collapse(groups,intensity=1){
  const labels=labelComponents();
  const columns=new Set(), moved=[];
  for(const group of groups){
    const [x,y]=group[0];
    burst(group,C[board[y][x]],intensity);
    for(const [a,b] of group){
      board[b][a]=-1;
      columns.add(a);
    }
  }
  for(const x of columns){
    let destination=N-1;
    for(let y=N-1;y>=0;y--){
      if(board[y][x]<0)continue;
      board[destination][x]=board[y][x];
      labels[destination][x]=labels[y][x];
      if(destination!==y)moved.push([x,destination,y]);
      destination--;
    }
    for(let y=destination;y>=0;y--){
      board[y][x]=rand();
      labels[y][x]=0;
      moved.push([x,y,y-destination-1]);
    }
  }
  paintBoard(moved);
  return {labels,moved};
}
function chainGroups({labels,moved}){
  const seen=new Set(), groups=[];
  for(const [x,y] of moved){
    if(seen.has(y*N+x))continue;
    const group=findGroup(x,y,seen);
    if(group.length<CHAIN_MIN)continue;
    const first=labels[y][x];
    if(first===0||group.some(([a,b])=>labels[b][a]!==first))groups.push(group);
  }
  return groups;
}
function resolveChain(fall,wave){
  const groups=wave<=MAX_CHAIN_WAVES?chainGroups(fall):[];
  settleEvent=scene.time.delayedCall(FALL_MS+10,()=>{
    settleEvent=null;
    if(!playing)return;
    if(!groups.length){
      busy=false;
      return;
    }
    const points=groups.reduce((total,group)=>total+group.length*group.length*5*wave,0);
    const gained=points*(elapsed<overUntil?3:1);
    award(points);
    flash('CHAÎNE ×'+wave+' · +'+gained,'chain');
    cue('chain');
    updateHud();
    resolveChain(collapse(groups,2),wave+1);
  });
}
function pressureForGroup(size){
  return size<7?PRESSURE_BY_SIZE[size]:-Math.min(15,8+(size-7)*2);
}
function comboPoints(size){
  const base=10*size*size;
  const steps=Math.min(combo-1,5);
  return base+Math.floor(base*steps*Math.min(size-1,5)/25);
}
function updateCombo(size){
  if(elapsed-lastMove>=COMBO_MS){
    combo=0;
    qualityMoves=0;
    comboTier=0;
  }
  combo=Math.min(combo+1,12);
  lastMove=elapsed;
  if(size>=4)qualityMoves++;
  if(size>=4&&combo>=6&&qualityMoves>=3&&comboTier<3){
    comboTier=3;
    return 3;
  }
  if(size>=4&&combo>=4&&qualityMoves>=2&&comboTier<2){
    comboTier=2;
    return 2;
  }
  return combo>=2?1:0;
}
function energyForGroup(size,reward){
  return Math.min(22,2+(size-2)*2+Math.max(0,size-4)*2)+(reward===3?10:0);
}
function tap(x,y){
  if(!playing||busy)return;
  const group=findGroup(x,y,new Set());
  const size=group.length;
  if(size<2){
    sound(145,.065,'square',.01);
    return;
  }
  busy=true;
  const reward=updateCombo(size);
  award(comboPoints(size));
  changePressure(pressureForGroup(size));
  if(!playing)return;
  if(reward===3){
    flash('MEGA COMBO ×'+combo,'mega');
    cue('mega');
  }else if(reward===2){
    flash('SUPER COMBO ×'+combo,'super');
    cue('super');
  }else if(reward===1){
    flash('COMBO ×'+combo,'combo');
    cue('combo');
  }else{
    cue(size>=5?'large':'clear');
  }
  if(navigator.vibrate&&(size>=5||reward>=2))navigator.vibrate(reward===3?35:12);
  chargeOverdrive(energyForGroup(size,reward));
  updateHud();
  scene.cameras.main.shake(reward===3?110:60,reward===3?.003: .0012);
  resolveChain(collapse([group],reward>=2?3:size>=5?2:1),1);
}
class Game extends Phaser.Scene{
  constructor(){super('Game')}
  create(){
    scene=this;
    this.signs=[];
    this.bg=this.add.graphics().setDepth(-10);
    this.sun=this.add.graphics().setDepth(-9);
    this.city=this.add.graphics().setDepth(-8);
    this.traffic=[this.add.graphics().setDepth(-7),this.add.graphics().setDepth(-7)];
    this.palms=Array.from({length:4},()=>this.add.graphics().setDepth(-5));
    this.sideCity=this.add.graphics().setDepth(-6);
    this.sideLights=this.add.graphics().setDepth(-5.5);
    this.glass=this.add.graphics().setDepth(.5);
    makeCrystalTextures(this);
    this.boardFrame=this.add.graphics().setDepth(0);
    this.gems=Array.from({length:N*N},()=>this.add.image(0,0,'crystal-0').setDepth(1).setVisible(false));
    this.particles=Array.from({length:MAX_PARTICLES},()=>this.add.circle(0,0,2.5,0xffffff).setDepth(2).setVisible(false));
    this.scale.on('resize',()=>this.layout());
    this.layout();
    this.input.on('pointerdown',p=>{
      const x=Math.floor((p.x-this.left)/this.cell),y=Math.floor((p.y-this.top)/this.cell);
      if(x>=0&&x<N&&y>=0&&y<N)tap(x,y);
    });
  }
  update(time,delta){
    this.animateCity(time);
    if(!playing)return;
    elapsed+=delta;
    const previousPressure=Math.floor(pressure);
    // Pressure rises from 1.35 to 3.0 points/s over the first three minutes.
    changePressure(delta/1000*(1.35+1.65*Math.min(1,elapsed/180000)));
    if(!playing)return;
    const comboExpired=combo>0&&elapsed-lastMove>=COMBO_MS;
    if(comboExpired)combo=0;
    const crossedSecond=Math.floor((elapsed-delta)/1000)!==Math.floor(elapsed/1000);
    const crossedOverdriveEnd=elapsed-delta<overUntil&&elapsed>=overUntil;
    const crossedRecoveryEnd=elapsed-delta<recoverUntil&&elapsed>=recoverUntil;
    if(comboExpired||previousPressure!==Math.floor(pressure)||crossedSecond||crossedOverdriveEnd||crossedRecoveryEnd)updateHud();
    if(elapsed>=nextDisturbance&&!busy){
      nextDisturbance+=DISTURBANCE_MS;
      for(let i=0;i<3;i++)board[Phaser.Math.Between(0,N-1)][Phaser.Math.Between(0,N-1)]=rand();
      paintBoard();
      flash('PERTURBATION');
      sound(210,.23,'triangle',.025);
    }
  }
  layout(){
    const {width:w,height:h}=this.scale;
    const landscape=w>=760&&h<=500&&w>h;
    const hudBottom=Math.max($('hud').getBoundingClientRect().bottom,$('combo').getBoundingClientRect().bottom<h*.45?$('combo').getBoundingClientRect().bottom:0);
    const bottomTop=$('bottom').getBoundingClientRect().top;
    const top=landscape?15:Math.max(hudBottom+11,Math.min(112,h*.23));
    const bottom=landscape?h-16:Math.max(top+N,Math.min(h-10,bottomTop-34));
    this.w=w;
    this.h=h;
    const sides=Math.min(76,Math.max(28,Math.round(w*.105)));
    const usableWidth=w-2*sides;
    this.cell=Math.floor(Math.max(1,Math.min(usableWidth/N,(bottom-top)/N,72)));
    this.left=Math.floor((w-this.cell*N)/2);
    this.top=Math.floor((top+bottom-this.cell*N)/2);
    this.paintCity();
    paintBoard();
  }
  paintCity(){
    for(const sign of this.signs)sign.destroy();
    this.signs.length=0;
    const {w,h,bg,sun,city}=this;
    const horizon=this.horizon=Math.max(h*.13,Math.min(h*.36,this.top-58));
    const r=Math.min(w*.2,h*.13,105);
    const skyHeight=horizon+r*.2;
    bg.clear();
    bg.fillGradientStyle(0x0b0e2d,0x211345,0x9a3b80,0xcf5087);
    bg.fillRect(0,0,w,skyHeight);
    bg.fillGradientStyle(0x9a3b80,0xcf5087,0xf1917a,0xf8ac7e);
    bg.fillRect(0,skyHeight,w,h*.5-skyHeight);
    bg.fillGradientStyle(0x171531,0x171531,0x0b1027,0x24153e);
    bg.fillRect(0,h*.5,w,h*.5);
    // Low-contrast reflections keep the foreground distinct from the playable grid.
    const promenade=this.top+this.cell*N+9;
    for(let i=0;i<20;i++){
      const x=(i*97+23)%Math.max(1,w), y=promenade+10+i*7;
      bg.fillStyle(i%3===0?0x6df3ef:0xf976c0,.12*(1-i/22));
      bg.fillEllipse(x,y,18+(i*17)%76,2);
    }
    bg.fillStyle(0xffdaee,.7);
    for(let i=0;i<31;i++)bg.fillCircle((i*83+19)%Math.max(1,w),(i*29+13)%Math.max(1,horizon-r*.7),i%7===0?1.3:.65);
    sun.clear();
    sun.fillStyle(0xfc9a87,.1);
    sun.fillCircle(w*.56,horizon-r*.4,r*1.23);
    sun.fillStyle(0xffc794,1);
    sun.fillCircle(w*.56,horizon-r*.4,r);
    sun.lineStyle(3,0xcc5483,.72);
    for(let i=0;i<6;i++){
      const y=r*(.12+i*.14),half=Math.sqrt(r*r-y*y);
      sun.lineBetween(w*.56-half,horizon-r*.4+y,w*.56+half,horizon-r*.4+y);
    }
    city.clear();
    for(let i=0;i<19;i++){
      const x=i*w/18, bh=16+(i*37)%67;
      city.fillStyle(0x42244f,1);
      city.fillRect(x,horizon+21-bh,w/17,bh);
      city.fillStyle(0xe094b8,.38);
      for(let j=8;j<bh-3;j+=10)city.fillRect(x+3,horizon+21-bh+j,2,2);
    }
    const hotelWidth=Math.max(48,Math.min(w*.26,132));
    this.hotel(w*.05,horizon+32,hotelWidth,hotelWidth*.83,0xeab2ba,0xffa4d1,'PALOMA');
    this.hotel(w-hotelWidth-w*.045,horizon+39,hotelWidth,hotelWidth*.97,0xb8bedb,0x86f8e8,'MARÉE');
    city.fillStyle(0x201632,1);
    city.fillRect(0,horizon+39,w,23);
    city.lineStyle(1,0xffa1c7,.55);
    city.lineBetween(0,horizon+40,w,horizon+40);
    for(let i=0;i<16;i++){
      const x=i*w/15;
      city.fillStyle(i%2?0x74f4ed:0xff84c1,.19);
      city.fillEllipse(x,horizon+57+(i*19)%74,14+(i*7)%25,3);
      city.fillStyle(0xffd6aa,.38);
      city.fillRect(x,horizon+50,9,1);
    }
    this.traffic.forEach((car,i)=>{
      car.clear();
      car.fillStyle(0x1a1230,1);
      car.fillRoundedRect(-18,-6,36,8,3);
      car.fillRoundedRect(-9,-10,17,7,3);
      car.fillStyle(0xde77b1,.8);
      car.fillRect(-6,-9,11,3);
      car.fillStyle(0xffe6ad,.19);
      car.fillTriangle(16,-3,45,-8,45,3);
      car.fillStyle(0xffecc4,1);
      car.fillRect(14,-4,5,2);
      car.fillStyle(0xff4486,1);
      car.fillRect(-18,-4,3,2);
      car.setScale(i===0?1:-.83,i===0?1:.83);
    });
    this.paintSideCity();
    this.palms.forEach((p,i)=>this.drawPalm(p,i,horizon));
    this.paintGlass();
  }
  paintSideCity(){
    const {w,h,left,top,cell,sideCity:g,sideLights:lights}=this;
    const edge=Math.min(left-6,150);
    const boardBottom=top+cell*N;
    g.clear();
    lights.clear();
    for(const side of [-1,1]){
      const x=distance=>side<0?distance:w-distance;
      const neon=side<0?0xff6db9:0x67eddc;
      const tint=side<0?0x91477b:0x416e86;
      const roof=top+Math.min(36,cell*.65);
      const foot=boardBottom-Math.min(38,cell*.63);
      const body=(layer,color,alpha,points)=>{
        layer.fillStyle(color,alpha);
        layer.fillPoints(points.map(([a,b])=>({x:x(a),y:b})),true);
      };
      body(g,0x120e27,1,[[0,roof-19],[edge*.94,roof+20],[edge*1.27,foot-9],[0,foot+38]]);
      body(g,tint,1,[[0,roof],[edge*.74,roof+22],[edge*.74,foot],[0,foot+22]]);
      body(g,0x30264d,1,[[edge*.74,roof+22],[edge*1.27,roof+43],[edge*1.27,foot-15],[edge*.74,foot]]);
      body(g,0x462346,1,[[0,roof-10],[edge*.74,roof+16],[edge*.74,roof+29],[0,roof+8]]);
      for(let row=0;row<5;row++){
        const y=roof+44+(foot-roof-53)*row/5;
        const height=Math.min(23,Math.max(6,(foot-roof)*.07));
        for(let col=0;col<2;col++){
          const a=edge*(.04+.33*col), b=a+edge*.23;
          body(g,0x17142d,1,[[a,y],[b,y+4],[b,y+height+4],[a,y+height]]);
          body(lights,row%2===0?0xffcd98:neon,.72,[[a+2,y+2],[b-2,y+5],[b-2,y+height],[a+2,y+height-2]]);
        }
        g.lineStyle(1,0xeeb4d7,.4);
        g.lineBetween(x(0),y+height+3,x(edge*.74),y+height+13);
      }
      const signX=x(edge*.83), signY=roof+Math.min(59,cell*1.04);
      g.fillStyle(0x171026,1);
      g.fillRoundedRect(signX-8,signY-10,16,65,4);
      g.lineStyle(5,neon,.14);
      g.strokeRoundedRect(signX-8,signY-10,16,65,4);
      g.lineStyle(1,neon,.94);
      g.strokeRoundedRect(signX-8,signY-10,16,65,4);
      const label=side<0?'O\nC\nE\nA\nN':'L\nU\nN\nA';
      this.signs.push(this.add.text(signX,signY-3,label,{

      g.lineStyle(3,neon,.18);

  paintGlass(){

  }
  drawPalm(g,i,horizon){
    const far=i<2, side=i%2===0?1:-1, scale=far?.55:1;

    const y=horizon+(far?51:103);
    g.clear();
    g.setPosition(x,y).setScale(scale);
    g.lineStyle(far?5:8,far?0x372042:0x19142e,1);
    g.beginPath();
    g.moveTo(0,0);
    g.lineTo(side*9,-37);
    g.lineTo(side*24,-85);
    g.strokePath();
    g.lineStyle(1,far?0x966382:0x76527f,.65);
    g.lineBetween(side*1,-7,side*9,-37);
    g.lineBetween(side*9,-37,side*24,-85);
    g.fillStyle(far?0x472750:0x1c1835,1);
    for(let j=0;j<7;j++){
      const angle=-Math.PI+j*Math.PI/6, length=30+(j%3)*8;
      const dx=Math.cos(angle)*length,dy=Math.sin(angle)*length;
      g.fillPoints([{x:side*24,y:-85},{x:side*24+dx*.57,y:-92+dy*.55},
        {x:side*24+dx,y:-76+dy},{x:side*24+dx*.54,y:-81+dy*.56}],true);
      g.lineStyle(.8,far?0xd08cb5:0x9b6799,.42);
      g.lineBetween(side*24,-85,side*24+dx*.91,-78+dy*.94);
    }
  }
  animateCity(time){
    this.sun.setAlpha(.92+.08*Math.sin(time/1600));
    this.sideLights.setAlpha(.76+.18*Math.sin(time/1020));
    this.glass.setAlpha(.30+.20*Math.sin(time/1650));
    this.palms.forEach((p,i)=>p.setRotation(Math.sin(time/1900+i)*.025));
    this.traffic.forEach((car,i)=>{
      const travel=(time*(i===0?.043:.036)+i*this.w*.47)%(this.w+115);
      car.setPosition(i===0?travel-55:this.w+55-travel,this.horizon+46+i*8);
    });
    this.signs.forEach((sign,i)=>sign.setAlpha(.86+.14*Math.sin(time/730+i)));
  }
}
