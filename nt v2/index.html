<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>

let board=[],score=0,pressure=PRESSURE.initial,energy=0,combo=0,lastMove=-Infinity;
let cityPhase=0,phaseStarted=0;
let cityMix=[1,0,0,0],cityFrom=cityMix.slice();
let qualityMoves=0,comboTier=0,critical=false;
let elapsed=0,nextDisturbance=DISTURBANCE_MS,overUntil=0,recoverUntil=0,settleEvent=null;
let playing=false,busy=false,musicEnabled=true,effectsEnabled=true,scene=null,audio=null,musicClock=null,best=0;

  [[3,68,3],[8,72,2],[13,65,2]],
  [[1,70,2],[6,77,2],[9,74,3],[14,70,1]],

let stemRequest,stemPack,stemVoices=[],musicPhase=0,overdriveAudio=false;

const hz=note=>440*2**((note-69)/12);

    wave(211,t)*.27*Math.exp(-t*97)))*Math.exp(-t*18));

    last=sample;

  render('clap',.22,t=>highNoise()*(.78*Math.exp(-t*35)+.34*Math.exp(-Math.abs(t-.018)*92)+.23*Math.exp(-Math.abs(t-.033)*87)));

  render('hat',.11,t=>highNoise()*Math.exp(-t*48));

function hit(name,when,volume,rate=1,length=0){
  const source=audio.createBufferSource(), gain=audio.createGain();

  if(length){

    gain.gain.exponentialRampToValueAtTime(.0001,when+length);

// Four eight-bar phrases with an opening, a drop, a break and a final build.

  const phrase=Math.floor(bar/8), slot=bar%8, harmony=PROGRESSION[slot];

function loadStemPack(){
  if(!STEM_PACK||stemRequest)return;
  const {bars,files}=STEM_PACK;
  stemRequest=Promise.resolve().then(async()=>{
    if(!Number.isInteger(bars)||bars<1||files.length!==5)throw Error('Expected five stems and a positive bar count');
    const duration=bars*16*STEP;
    const buffers=await Promise.all(files.map(async file=>{
      const url=new URL(file,document.baseURI);
      if(url.origin!==location.origin)throw Error('Music stems must be local');
      const response=await fetch(url);
      if(!response.ok)throw Error('Missing stem: '+file);
      const buffer=await audio.decodeAudioData(await response.arrayBuffer());
      if(buffer.duration<duration||buffer.duration>duration+.12)throw Error('Invalid stem loop length: '+file);
      return buffer;
    }));
    stemPack={duration,buffers};
  }).catch(error=>console.warn('Using the ARCADE MAYHEM audio prototype:',error.message));
}
function stopStems(){

function startStems(when){

    const source=audio.createBufferSource(), gain=audio.createGain();
    source.buffer=buffer;
    source.loop=true;
    source.loopEnd=stemPack.duration;
    gain.gain.value=0;
    source.connect(gain).connect(musicLevel);
    source.start(when,offset);
    return {source,gain};
  });

}
function mixStems(when){

function scheduleMusic(){
  if(!playing||audio.state!=='running')return;
  const now=audio.currentTime;
  if(nextNote<now)nextNote=now+.012;
  while(nextNote<now+.09){
    const downbeat=musicStep%16===0, beat=musicStep%4===0;
    if(downbeat&&musicPhase!==cityPhase){
      fallbackFrom=musicPhase;
      musicPhase=cityPhase;
      fallbackFadeAt=nextNote;
      if(stemVoices.length)mixStems(nextNote);
    }
    if(beat&&overdriveAudio!==(elapsed<overUntil)){
      overdriveAudio=elapsed<overUntil;
      if(stemVoices.length)mixStems(nextNote);
    }
    if(downbeat&&stemPack&&!stemVoices.length)startStems(nextNote);
    if(!stemVoices.length&&musicEnabled){
      const blend=Math.min(1,(nextNote-fallbackFadeAt)/STEM_FADE_SECONDS);

      arrangeStep(musicStep,nextNote,intensity,overdriveAudio);

      if(cursor===particles.length)return;

      const angle=Math.random()*Math.PI*2;
      const distance=cell*(reducedMotion.matches?.18+Math.random()*.26:.31+Math.random()*.83);

        .setScale((i===0&&intensity>=2?2.2:.72)+Math.random(),i===0?.46:.85).setRotation(angle).setVisible(true);

function findGroup(x,y,seen){
  const color=board[y][x], stack=[[x,y]], group=[];
  while(stack.length){
    const [a,b]=stack.pop(), key=b*N+a;
    if(a<0||a>=N||b<0||b>=N||seen.has(key)||board[b][a]!==color)continue;
    seen.add(key);
    group.push([a,b]);
    stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
  }
  return group;

  const labels=Array.from({length:N},()=>Array(N).fill(0));

  let label=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(seen.has(y*N+x))continue;
    label++;
    for(const [a,b] of findGroup(x,y,seen))labels[b][a]=label;

      columns.add(a);

  for(const x of columns){
    let destination=N-1;
    for(let y=N-1;y>=0;y--){
      if(board[y][x]<0)continue;
      board[destination][x]=board[y][x];
      labels[destination][x]=labels[y][x];
      if(destination!==y)moved.push([x,destination,y]);
      destination--;
    }
    for(let y=destination;y>=0;y--){
      board[y][x]=rand();

    if(group.length<CHAIN_MIN)continue;

function passivePressureBetween(fromMs,toMs){
  // Integrate the linear ramp, then accumulate at the capped rate.
  const rampFrom=Math.min(fromMs,PRESSURE.rampMs);
  const rampTo=Math.min(toMs,PRESSURE.rampMs);
  const averageRampFraction=(rampFrom+rampTo)/(2*PRESSURE.rampMs);
  const averageRampRate=PRESSURE.passiveStartPerSecond+
    (PRESSURE.passiveMaxPerSecond-PRESSURE.passiveStartPerSecond)*averageRampFraction;
  return (averageRampRate*(rampTo-rampFrom)+PRESSURE.passiveMaxPerSecond*(toMs-fromMs-rampTo+rampFrom))/1000;
}
function pressureForGroup(size){

function energyForGroup(size,reward){
  return Math.min(22,2+(size-2)*2+Math.max(0,size-4)*2)+(reward===3?10:0);
}
function tap(x,y){
  if(!playing||busy)return;
  const group=findGroup(x,y,new Set());
  const size=group.length;
  if(size<2){
    sound(145,.065,'square',.01);
    return;
  }
  busy=true;
  const reward=updateCombo(size);
  const previousScore=score;
  award(comboPoints(size));
  changePressure(pressureForGroup(size));
  if(!playing)return;
  if(reward===3){
    flash('MEGA COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'mega');
    cue('mega');
  }else if(reward===2){
    flash('SUPER COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'super');
    cue('super');
  }else if(reward===1){
    flash('COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'combo');
    cue('combo');
  }else{
    if(size>=5)flash('+'+(score-previousScore).toLocaleString('fr-FR')+' PTS','clear');
    cue(size>=5?'large':'clear');
  }
  if(size>=5||reward>0)cityImpact=Math.max(cityImpact,reward>=2?.87:size>=5?.63:.36);
  if(navigator.vibrate&&(size>=5||reward>=2))navigator.vibrate(reward===3?35:12);
  chargeOverdrive(energyForGroup(size,reward));
  updateHud();
  if(!reducedMotion.matches&&(reward>=2||size>=7))scene.cameras.main.shake(85,reward===3?.0026:.0014);
  resolveChain(collapse([group],reward>=2?3:size>=5?2:1),1);
}

    l.fillEllipse(-15,this.h*.36+7,112,3);
  }
  animateCity(time){
    let coverage=0,sun=0,lights=0,night=0,reflection=0,depth=0;
    for(let i=0;i<CITY_PHASES.length;i++){
      const weight=cityMix[i], phase=CITY_PHASES[i];
      coverage+=weight;
      this.skies[i].setVisible(weight>.001).setAlpha(coverage?weight/coverage:0);
      sun+=weight*phase.sun;
      lights+=weight*phase.lights;
      night+=weight*phase.night;
      reflection+=weight*phase.reflection;
      depth+=weight*phase.depth;
    }
    this.sun.setAlpha(sun*(.94+.06*Math.sin(time/1600)));
    this.stars.setAlpha(.13+night);
    this.cityShade.setAlpha(night);
    const subdued=reducedMotion.matches;
    const active=playing&&elapsed<overUntil;
    const impact=subdued?0:cityImpact;
    const danger=playing?Math.max(0,(pressure-60)/40):0;
    const sway=subdued?0:Math.sin(time/3400);
    this.edgeDanger.setAlpha(danger*.79);
    this.warmSpill.setAlpha(danger*.82);
    this.edgeElectric.setAlpha(active?(subdued?.58:.65+.13*Math.sin(time/240)):impact*.65);
    this.neonSpill.setAlpha(active?.87:impact*.58);
    this.lightSweep.setVisible(!subdued).setX(time*.023%(this.w+135)-65).setAlpha(.48+impact*.35);
    this.cityWindows.setAlpha(Math.min(1,lights*(.82+(subdued?0:.16*Math.sin(time/1260)))+impact*.35+(active?.16:0)));
    this.sideLights.setAlpha(Math.min(1,lights*(.82+(subdued?0:.18*Math.sin(time/1020)))+impact*.29+(active?.19:0)));
    this.streetGlow.setAlpha(Math.min(1,reflection*(.82+(subdued?0:.17*Math.sin(time/1420)))+impact*.34+(active?.17:0)));
    this.sun.setX(depth*2.6*sway);
    this.city.setX(depth*1.2*sway);
    this.cityShade.setX(this.city.x);
    this.cityWindows.setX(this.city.x);
    this.glass.setAlpha(.30+(subdued?0:.20*Math.sin(time/1650))+impact*.30);
    this.palms.forEach((p,i)=>p.setRotation((subdued?0:Math.sin(time/1900+i))*.025*depth));
    this.traffic.forEach((car,i)=>{
      const travel=(time*(i===0?.043:.036)+i*this.w*.47)%(this.w+115);
      car.setPosition(i===0?travel-55:this.w+55-travel,this.horizon+46+i*8);
    });
    this.signs.forEach((sign,i)=>sign.setAlpha(Math.min(1,lights*(.85+(subdued?0:.15*Math.sin(time/730+i)))+impact*.4+(active?.15:0))).setX(sign.homeX+1.5*sway));
  }
}

}
