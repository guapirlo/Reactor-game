<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#150d30"><title>REACTOR 2.0 · Miami 1986</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100a24;color:white;font-family:system-ui,Arial}#game{position:fixed;inset:0}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:13px 18px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000}#hud strong{letter-spacing:2px}#hud small{display:block;font-size:10px;letter-spacing:2px;color:#8cf9ff}#score{font-size:22px;font-weight:900}#world{position:fixed;top:75px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:4px;color:#ffe1ad;text-shadow:0 2px 8px black}#footer{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800}#meter{height:13px;flex:1;background:#130d2c;border:1px solid #fcb8d8;border-radius:20px;overflow:hidden}#fill{width:10%;height:100%;background:linear-gradient(90deg,#38f2d8,#ffd264,#ff4b8b);transition:width .2s}button{border:1px solid #ff84b9;background:#25143d;color:white;padding:10px;border-radius:12px;font-weight:800}#overlay{position:fixed;inset:0;background:#10091ddf;display:grid;place-items:center;z-index:4;padding:20px}#overlay[hidden]{display:none}#panel{text-align:center;max-width:350px;border:1px solid #ff85b9;background:#21103e;border-radius:22px;padding:24px;box-shadow:0 0 50px #ff4c9960}#panel h1{color:#ff9bc7;letter-spacing:3px}#panel p{line-height:1.5;color:#e9dff1}#panel button{background:#ff6eb5;color:#1b0925;padding:13px 26px}</style></head><body><div id="game"></div><div id="hud"><div><strong>REACTOR <span style="color:#ff79b6">2.0</span></strong><small>PHASER · MOBILE TEST</small></div><div id="score">0</div></div><div id="world">MIAMI · 1986</div><div id="footer">PRESSION <div id="meter"><div id="fill"></div></div><span id="pct">10%</span><button id="mute">♫</button></div><div id="overlay"><div id="panel"><h1>MIAMI 1986</h1><p>Premier prototype Phaser de REACTOR 2.0.<br>Appuie sur un groupe de 2 cristaux identiques ou plus. Les grands groupes refroidissent le réacteur.</p><button id="start">JOUER</button><p style="font-size:11px">Paysage animé · musique originale synthétisée</p></div></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
(()=>{'use strict';const N=7,C=[0x35eddd,0xff77bd,0xffd166,0x9e8cff,0x6ca9ff],$=id=>document.getElementById(id);let board=[],score=0,pressure=10,scene=null,playing=false,busy=false,audio=null,muted=false,musicTimer=null,beat=0,graphics=[];const rand=()=>Math.floor(Math.random()*C.length);function tone(freq,d=.15,type='sine',vol=.025){if(muted||!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.01)}function music(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(musicTimer)return;const notes=[329.63,392,440,523.25,440,392,329.63,293.66,261.63,329.63,392,440,392,329.63,293.66,261.63];musicTimer=setInterval(()=>{if(!playing||muted)return;const i=beat++%16;tone(notes[i],.22,'sawtooth',.011);if(i%4===0)tone(i%8?110:82.4,.32,'triangle',.05);if(i%2===0)tone(140,.045,'square',.007)},245)}function hud(){$('score').textContent=score.toLocaleString('fr-FR');$('pct').textContent=Math.round(pressure)+'%';$('fill').style.width=pressure+'%'}function clearGraphics(){for(const g of graphics)g.destroy();graphics=[]}function drawBoard(){if(!scene||!board.length)return;clearGraphics();const {cell,left,top}=scene,g=scene.add.graphics();graphics.push(g);g.fillStyle(0x0a0a2b,.82);g.fillRoundedRect(left-8,top-8,cell*N+16,cell*N+16,14);g.lineStyle(2,0xff9ed2,.8);g.strokeRoundedRect(left-8,top-8,cell*N+16,cell*N+16,14);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=left+(x+.5)*cell,py=top+(y+.5)*cell,r=cell*.39,col=C[board[y][x]];g.fillStyle(col,.15);g.fillRoundedRect(px-r-3,py-r-3,r*2+6,r*2+6,8);g.fillStyle(col);g.fillPoints([{x:px,y:py-r},{x:px+r*.85,y:py-r*.13},{x:px+r*.55,y:py+r*.84},{x:px-r*.55,y:py+r*.84},{x:px-r*.85,y:py-r*.13}],true);g.lineStyle(1.6,0xffffff,.55);g.lineBetween(px,py-r*.9,px-r*.25,py+r*.7);g.lineBetween(px,py-r*.9,px+r*.28,py+r*.65)}}function newGame(){board=Array.from({length:N},()=>Array.from({length:N},rand));score=0;pressure=10;playing=true;busy=false;hud();drawBoard()}function end(){playing=false;$('panel').innerHTML='<h1>RÉACTEUR CRITIQUE</h1><p>Score : '+score.toLocaleString('fr-FR')+'</p><button id="again">REJOUER</button>';$('overlay').hidden=false;$('again').onclick=()=>{$('overlay').hidden=true;newGame();music()}}function tap(x,y){if(!playing||busy)return;const target=board[y][x],stack=[[x,y]],seen=new Set(),group=[];while(stack.length){const [a,b]=stack.pop(),k=a+','+b;if(a<0||a>=N||b<0||b>=N||seen.has(k)||board[b][a]!==target)continue;seen.add(k);group.push([a,b]);stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}if(group.length<2){tone(140,.08,'square',.012);return}busy=true;score+=group.length*group.length*10;pressure=Math.max(0,Math.min(100,pressure+Math.max(-12,7-group.length*2)));tone(300+group.length*36,.2,'triangle',.035);for(const [a,b]of group)board[b][a]=-1;for(let a=0;a<N;a++){const values=[];for(let b=N-1;b>=0;b--)if(board[b][a]>=0)values.push(board[b][a]);for(let b=N-1;b>=0;b--)board[b][a]=values[N-1-b]??rand()}hud();scene.cameras.main.shake(65,.0014);scene.time.delayedCall(115,()=>{drawBoard();busy=false;if(pressure>=100)end()})}class Game extends Phaser.Scene{constructor(){super('Game')}create(){scene=this;this.bg=this.add.graphics();this.scale.on('resize',()=>this.layout());this.layout();this.input.on('pointerdown',p=>{const x=Math.floor((p.x-this.left)/this.cell),y=Math.floor((p.y-this.top)/this.cell);if(x>=0&&x<N&&y>=0&&y<N)tap(x,y)});this.time.addEvent({delay:45000,loop:true,callback:()=>{if(!playing||busy)return;for(let i=0;i<3;i++)board[Phaser.Math.Between(0,6)][Phaser.Math.Between(0,6)]=rand();drawBoard();tone(190,.3,'triangle',.03)}})}layout(){const w=this.scale.width,h=this.scale.height;this.w=w;this.h=h;this.cell=Math.max(28,Math.floor(Math.min((w-28)/7,(h-220)/7,67)));this.left=Math.floor((w-7*this.cell)/2);this.top=Math.max(115,Math.floor(h*.52-this.cell*3.5));this.paint(0);drawBoard()}paint(t){const g=this.bg,w=this.w,h=this.h;if(!g)return;g.clear();g.fillGradientStyle(0x160b36,0x160b36,0x9e327e,0xf7a178);g.fillRect(0,0,w,h);const sy=h*.29,r=Math.min(90,w*.23);g.fillStyle(0xffc27c);g.fillCircle(w*.5,sy,r);g.lineStyle(4,0xe56b94,.85);for(let i=0;i<5;i++){const yy=sy+r*.12+i*r*.18;g.lineBetween(w*.5-r*.95,yy,w*.5+r*.95,yy)}g.fillStyle(0x28132f);for(let i=0;i<15;i++){const bh=22+(i*37)%65;g.fillRect(i*w/14,sy+r*.85-bh,w/14+1,bh)}const horizon=sy+r*.85;g.fillStyle(0x130d2b);g.fillRect(0,horizon,w,h-horizon);g.lineStyle(1,0x43e5df,.35);for(let i=-8;i<=8;i++)g.lineBetween(w*.5,horizon,w*.5+i*w*.25,h);for(let i=1;i<12;i++){let q=i/12,yy=horizon+(h-horizon)*q*q;g.lineBetween(0,yy,w,yy)}for(const side of [-1,1]){const px=side<0?w*.1:w*.9;g.lineStyle(3,0x10152a);g.lineBetween(px,horizon-65,px,horizon+5);g.lineBetween(px,horizon-48,px+side*25,horizon-70);g.lineBetween(px,horizon-48,px-side*25,horizon-65)} }update(time){if(Math.floor(time/500)%2===0&&Math.floor((time-16)/500)%2!==0)this.paint(time)}}new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#130c2d',scale:{mode:Phaser.Scale.RESIZE,width:innerWidth,height:innerHeight},scene:[Game]});$('start').onclick=()=>{$('overlay').hidden=true;newGame();music()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'♪':'♫';if(!muted)music()};})();
</script></body></html>
