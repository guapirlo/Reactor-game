<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>

// Temporary procedural prototype. Set this to a local stem pack when the original production is ready.

const STEM_FADE_SECONDS=1.15;
const STEP=60/104/4;
const HARMONY=[[33,57,60,64,71],[29,53,56,60,67],[34,53,58,62,65],[28,52,56,62,65]];

const MOTIF=[

  [[3,68,3],[8,72,2],[13,65,2]],

  [[2,71,3],[7,68,2],[11,65,2],[15,68,1]]

const hz=note=>440*2**((note-69)/12);

  const oscillator=audio.createOscillator();
  const gain=audio.createGain();
  oscillator.type=type;
  oscillator.frequency.setValueAtTime(frequency,when);
  gain.gain.setValueAtTime(.0001,when);

  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);

    oscillator.connect(filter).connect(gain);

  oscillator.start(when);
  oscillator.stop(when+duration+.01);

function sound(frequency,duration=.14,type='triangle',volume=.035,offset=0){

  synth(frequency,audio.currentTime+.004+offset,duration,type,volume,effectsBus);

function buildKit(){

  render('kick',.29,t=>Math.tanh(1.6*(Math.sin(2*Math.PI*(48*t+2.1*(1-Math.exp(-t*57))))+
    wave(211,t)*.27*Math.exp(-t*97)))*Math.exp(-t*18));

    .68*(1-Math.exp(-t*39)))))*Math.exp(-t*2.25));

    last=sample;

  render('riser',.45,t=>highNoise()*Math.min(1,t/.42)**1.6);

function hit(name,when,volume,rate=1,length=0){
  const source=audio.createBufferSource(), gain=audio.createGain();
  source.buffer=samples[name];
  source.playbackRate.value=rate;
  gain.gain.setValueAtTime(volume,when);
  if(length){
    gain.gain.setValueAtTime(volume,when+length-.028);
    gain.gain.exponentialRampToValueAtTime(.0001,when+length);
  }
  source.connect(gain).connect(musicBus);
  source.start(when);
  if(length)source.stop(when+length);

// Four eight-bar phrases with an opening, a drop, a break and a final build.
function arrangeStep(step,when,intensity=musicPhase,active=overdriveAudio){
  const bar=Math.floor(step/16)%32, pulse=step%16;
  const phrase=Math.floor(bar/8), slot=bar%8, harmony=PROGRESSION[slot];
  const [root,...chord]=HARMONY[harmony];

  const breakdown=phrase===2&&slot<3;
  const turnaround=slot===7&&pulse>=12;
  const drums=KICK_PATTERNS[Math.min(3,energyLevel+(phrase===1||phrase===3?1:0))];
  const swing=pulse%2?.012:0;
  if(pulse===0){
    for(const note of chord){

      if(phrase>=2&&energyLevel>=2)synth(hz(note+12),when,1.5,'sine',.007,musicBus,1710,.16);
    }
  }
  if(!breakdown&&drums.includes(pulse)&&!(turnaround&&pulse>13&&phrase===0)){
    hit('kick',when,.215+intensity*.013+(pulse===0?.025:0));
    if(energyLevel>=1||active)hit('knock',when+.002,.034+intensity*.012);
    const next=drums.find(value=>value>pulse)??16;
    const bassNote=root+((pulse>=10&&slot%4===3)?7:0);
    hit('sub',when+.016,.129+intensity*.025,hz(bassNote)/55,(next-pulse)*STEP-.025);

  if(pulse===4||pulse===12){

  if(pulse===3||pulse===10)hit('shaker',when+swing,.043,pulse===3?.89:1.13);

  }
  if((energyLevel>=2||active)&&pulse%4===2&&!breakdown){
    const note=chord[(pulse>>2)%chord.length]+(active?24:12);

  }

function loadStemPack(){
  if(!STEM_PACK||stemRequest)return;
  const {bars,files}=STEM_PACK;

    if(!Number.isInteger(bars)||bars<1||files.length!==5)throw Error('Expected five stems and a positive bar count');

    const buffers=await Promise.all(files.map(async file=>{
      const url=new URL(file,document.baseURI);
      if(url.origin!==location.origin)throw Error('Music stems must be local');
      const response=await fetch(url);
      if(!response.ok)throw Error('Missing stem: '+file);
      const buffer=await audio.decodeAudioData(await response.arrayBuffer());
      if(buffer.duration<duration||buffer.duration>duration+.12)throw Error('Invalid stem loop length: '+file);
      return buffer;

function stopStems(){
  for(const {source,gain} of stemVoices){
    source.stop();
    source.disconnect();
    gain.disconnect();
  }
  stemVoices=[];
}
function startStems(when){
  const offset=(musicStep*STEP)%stemPack.duration;
  stemVoices=stemPack.buffers.map(buffer=>{
    const source=audio.createBufferSource(), gain=audio.createGain();
    source.buffer=buffer;
    source.loop=true;
    source.loopEnd=stemPack.duration;
    gain.gain.value=0;
    source.connect(gain).connect(musicLevel);
    source.start(when,offset);
    return {source,gain};
  });

function mixStems(when){
  for(let i=0;i<stemVoices.length;i++){
    const gain=stemVoices[i].gain.gain;
    const target=i<4?(i<=musicPhase?1:0):(overdriveAudio?1:0);
    gain.setTargetAtTime(target,when,STEM_FADE_SECONDS/3);
  }

function scheduleMusic(){
  if(!playing||audio.state!=='running')return;
  const now=audio.currentTime;
  if(nextNote<now)nextNote=now+.012;
  while(nextNote<now+.09){
    const downbeat=musicStep%16===0, beat=musicStep%4===0;
    if(downbeat&&musicPhase!==cityPhase){
      fallbackFrom=musicPhase;
      musicPhase=cityPhase;
      fallbackFadeAt=nextNote;
      if(stemVoices.length)mixStems(nextNote);
    }
    if(beat&&overdriveAudio!==(elapsed<overUntil)){
      overdriveAudio=elapsed<overUntil;
      if(stemVoices.length)mixStems(nextNote);
    }
    if(downbeat&&stemPack&&!stemVoices.length)startStems(nextNote);
    if(!stemVoices.length&&musicEnabled){
      const blend=Math.min(1,(nextNote-fallbackFadeAt)/STEM_FADE_SECONDS);

function syncAudio(){
  if(!audio)return;

function music(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  if(!audio){
    audio=new Audio();
    musicLevel=audio.createGain();
    effectsBus=audio.createGain();
    musicLevel.gain.value=0;
    const limiter=audio.createDynamicsCompressor();
    limiter.threshold.value=-12;
    limiter.ratio.value=5;
    musicLevel.connect(limiter);
    effectsBus.connect(limiter);
    limiter.connect(audio.destination);
    samples=buildKit();
    resetMusicRun();
    loadStemPack();
    musicClock=setInterval(scheduleMusic,25);

  if(audio.state!=='running')audio.resume().catch(()=>{});

function resetMusicRun(){
  musicStep=0;
  nextNote=0;
  musicPhase=0;
  fallbackFrom=0;
  fallbackFadeAt=0;
  overdriveAudio=false;
  if(!audio)return;
  stopStems();
  if(musicBus)musicBus.disconnect();
  musicBus=audio.createGain();
  musicBus.connect(musicLevel);
}
function stopMusic(){
  if(!musicLevel)return;
  musicLevel.gain.setTargetAtTime(0,audio.currentTime,.075);
  for(const {source,gain} of stemVoices){
    source.onended=()=>{
      source.disconnect();
      gain.disconnect();
    };
    source.stop(audio.currentTime+.33);
  }
}
function pressureState(value){
  if(value>=100)return ['failed','ARRÊT'];
  if(value>=95)return ['maximum','DANGER'];
  if(value>=80)return ['critical','CRITIQUE'];
  if(value>=60)return ['hot','CHAUD'];
  if(value>=40)return ['warning','ALERTE'];
  return ['stable','STABLE'];
}
function overdriveSeconds(deadline){
  return Math.max(0,Math.ceil((deadline-elapsed)/1000));
}
function updateScoreDisplay(){
  if(score!==scoreTarget){
    const gained=score-scoreTarget;
    const crossedMilestone=Math.floor(score/5000)>Math.floor(scoreTarget/5000);
    scoreFrom=scoreShown;
    scoreTarget=score;
    scoreCountAt=elapsed;
    if(playing&&(gained>=SCORE_SURGE_MIN||crossedMilestone))scoreSurgeUntil=elapsed+(crossedMilestone?510:410);
  }
  const portion=playing&&!reducedMotion.matches?Math.min(1,(elapsed-scoreCountAt)/SCORE_COUNT_MS):1;
  const next=portion===1?scoreTarget:Math.round(scoreFrom+(scoreTarget-scoreFrom)*(1-(1-portion)**3));
  if(next!==scoreShown){
    scoreShown=next;
    $('score').textContent=scoreShown.toLocaleString('fr-FR');
  }
}
function updateDashboardLight(){
  const surge=playing&&!reducedMotion.matches&&(elapsed<scoreSurgeUntil||cityImpact>.63);
  if(surge===surgeDisplayed)return;

  $('hud').dataset.surge=String(surge);
  $('bottom').dataset.surge=String(surge);

function resetScoreDisplay(){
  scoreShown=scoreFrom=scoreTarget=score;
  scoreCountAt=scoreSurgeUntil=0;
  $('score').textContent=score.toLocaleString('fr-FR');

  const active=elapsed<overUntil;

function flash(message,style='notice'){
  const [priority,duration]=ANNOUNCEMENTS[style];
  const event={message,style,priority,duration,expires:elapsed+1750};
  if(!currentAnnouncement||priority>currentAnnouncement.priority){
    if(currentAnnouncement&&currentAnnouncement.style==='mega'){
      announcementQueue=announcementQueue.filter(item=>item.style!==currentAnnouncement.style);
      announcementQueue.push(currentAnnouncement);
      announcementQueue.sort((a,b)=>b.priority-a.priority);
      announcementQueue.length=Math.min(announcementQueue.length,3);
    }
    showAnnouncement(event);
    return;
  }
  if(priority<3)return;
  announcementQueue=announcementQueue.filter(item=>item.style!==style);
  announcementQueue.push(event);
  announcementQueue.sort((a,b)=>b.priority-a.priority);

}

function burst(cells,color,intensity){
  const {cell,left,top,particles}=scene;
  let cursor=0;
  for(const [x,y] of cells){
    for(let i=0;i<intensity+2;i++){
      while(cursor<particles.length&&particles[cursor].visible)cursor++;
      if(cursor===particles.length)return;
      const p=particles[cursor++];
      const angle=Math.random()*Math.PI*2;
      const distance=cell*(reducedMotion.matches?.18+Math.random()*.26:.31+Math.random()*.83);
      const cx=left+(x+.5)*cell,cy=top+(y+.5)*cell;
      p.setPosition(cx,cy).setFillStyle(color).setAlpha(1)
        .setScale((i===0&&intensity>=2?2.2:.72)+Math.random(),i===0?.46:.85).setRotation(angle).setVisible(true);
      scene.tweens.add({targets:p,x:cx+Math.cos(angle)*distance,y:cy+Math.sin(angle)*distance,
        alpha:0,scale:0,duration:150+Math.random()*110,onComplete:()=>p.setVisible(false)});
    }
  }
}

function findGroup(x,y,seen){
  const color=board[y][x], stack=[[x,y]], group=[];
  while(stack.length){
    const [a,b]=stack.pop(), key=b*N+a;
    if(a<0||a>=N||b<0||b>=N||seen.has(key)||board[b][a]!==color)continue;
    seen.add(key);
    group.push([a,b]);
    stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
  }
  return group;
}
// Label the connected components before each wave. Labels fall with their crystals.
function labelComponents(){
  const labels=Array.from({length:N},()=>Array(N).fill(0));
  const seen=new Set();
  let label=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(seen.has(y*N+x))continue;
    label++;
    for(const [a,b] of findGroup(x,y,seen))labels[b][a]=label;
  }
  return labels;
}
function collapse(groups,intensity=1){
  const labels=labelComponents();
  const columns=new Set(), moved=[];
  for(const group of groups){
    const [x,y]=group[0];
    burst(group,C[board[y][x]],intensity);
    for(const [a,b] of group){
      board[b][a]=-1;
      columns.add(a);
    }
  }
  for(const x of columns){
    let destination=N-1;
    for(let y=N-1;y>=0;y--){
      if(board[y][x]<0)continue;
      board[destination][x]=board[y][x];
      labels[destination][x]=labels[y][x];
      if(destination!==y)moved.push([x,destination,y]);
      destination--;
    }
    for(let y=destination;y>=0;y--){
      board[y][x]=rand();
      labels[y][x]=0;
      moved.push([x,y,y-destination-1]);
    }
  }
  paintBoard(moved);
  return {labels,moved};
}
function chainGroups({labels,moved}){
  const seen=new Set(), groups=[];
  for(const [x,y] of moved){
    if(seen.has(y*N+x))continue;
    const group=findGroup(x,y,seen);
    if(group.length<CHAIN_MIN)continue;
    const first=labels[y][x];
    if(first===0||group.some(([a,b])=>labels[b][a]!==first))groups.push(group);
  }
  return groups;
}
function resolveChain(fall,wave){
  const groups=wave<=MAX_CHAIN_WAVES?chainGroups(fall):[];
  settleEvent=scene.time.delayedCall(FALL_MS+10,()=>{
    settleEvent=null;

      busy=false;

    }
    const points=groups.reduce((total,group)=>total+group.length*group.length*5*wave,0);
    const gained=points*(elapsed<overUntil?3:1);
    award(points);
    flash('CHAÎNE ×'+wave+' · +'+gained,'chain');
    cityImpact=Math.max(cityImpact,.52);
    cue('chain');
    updateHud();
    resolveChain(collapse(groups,2),wave+1);
  });
}
function passivePressureBetween(fromMs,toMs){
  // Integrate the linear ramp, then accumulate at the capped rate.
  const rampFrom=Math.min(fromMs,PRESSURE.rampMs);
  const rampTo=Math.min(toMs,PRESSURE.rampMs);
  const averageRampFraction=(rampFrom+rampTo)/(2*PRESSURE.rampMs);
  const averageRampRate=PRESSURE.passiveStartPerSecond+
    (PRESSURE.passiveMaxPerSecond-PRESSURE.passiveStartPerSecond)*averageRampFraction;
  return (averageRampRate*(rampTo-rampFrom)+PRESSURE.passiveMaxPerSecond*(toMs-fromMs-rampTo+rampFrom))/1000;
}
function pressureForGroup(size){
  if(size<PRESSURE.largeGroupMinSize)return PRESSURE.manualBySize[size];
  const extra=size-PRESSURE.largeGroupMinSize;
  return -Math.min(PRESSURE.maxGroupCooling,PRESSURE.largeGroupBaseCooling+extra*PRESSURE.extraGemCooling);
}
function comboPoints(size){
  const base=10*size*size;
  const steps=Math.min(combo-1,5);
  return base+Math.floor(base*steps*Math.min(size-1,5)/25);
}
function updateCombo(size){
  if(elapsed-lastMove>=COMBO_MS){
    combo=0;
    qualityMoves=0;
    comboTier=0;
  }
  combo=Math.min(combo+1,12);
  lastMove=elapsed;
  if(size>=4)qualityMoves++;
  if(size>=4&&combo>=6&&qualityMoves>=3&&comboTier<3){
    comboTier=3;
    return 3;
  }
  if(size>=4&&combo>=4&&qualityMoves>=2&&comboTier<2){
    comboTier=2;
    return 2;
  }
  return combo>=2?1:0;
}
function energyForGroup(size,reward){
  return Math.min(22,2+(size-2)*2+Math.max(0,size-4)*2)+(reward===3?10:0);
}
function tap(x,y){
  if(!playing||busy)return;
  const group=findGroup(x,y,new Set());
  const size=group.length;
  if(size<2){
    sound(145,.065,'square',.01);
    return;
  }
  busy=true;
  const reward=updateCombo(size);
  const previousScore=score;
  award(comboPoints(size));
  changePressure(pressureForGroup(size));
  if(!playing)return;
  if(reward===3){
    flash('MEGA COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'mega');
    cue('mega');
  }else if(reward===2){
    flash('SUPER COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'super');
    cue('super');
  }else if(reward===1){
    flash('COMBO ×'+combo+(size>=5?' · +'+(score-previousScore).toLocaleString('fr-FR'):''),'combo');
    cue('combo');
  }else{
    if(size>=5)flash('+'+(score-previousScore).toLocaleString('fr-FR')+' PTS','clear');
    cue(size>=5?'large':'clear');
  }
  if(size>=5||reward>0)cityImpact=Math.max(cityImpact,reward>=2?.87:size>=5?.63:.36);
  if(navigator.vibrate&&(size>=5||reward>=2))navigator.vibrate(reward===3?35:12);
  chargeOverdrive(energyForGroup(size,reward));
  updateHud();
  if(!reducedMotion.matches&&(reward>=2||size>=7))scene.cameras.main.shake(85,reward===3?.0026:.0014);
  resolveChain(collapse([group],reward>=2?3:size>=5?2:1),1);
}

  layout(){
    const {width:w,height:h}=this.scale;
    const landscape=w>=760&&h<=500&&w>h;
    const hud=$('hud').getBoundingClientRect();
    const controls=$('bottom').getBoundingClientRect();
    const comboBounds=$('combo').getBoundingClientRect();
    const hudBottom=Math.max(hud.bottom,comboBounds.bottom<h*.45?comboBounds.bottom:0);
    const controlsTop=controls.top+(this.meterLift||0);
    // Keep the 3.5 grid budget. The pressure-only panel gives us extra clearance.
    const priorControlsTop=controlsTop-Math.max(0,75-controls.height);
    const top=landscape?15:Math.max(hudBottom+11,Math.min(112,h*.23));
    const bottom=landscape?h-16:Math.max(top+N,Math.min(h-10,priorControlsTop-34));
    this.w=w;
    this.h=h;
    const insets=getComputedStyle($('game'));
    const safeLeft=parseFloat(insets.getPropertyValue('--safe-left'))||0;
    const safeRight=parseFloat(insets.getPropertyValue('--safe-right'))||0;
    const rail=Math.min(54,Math.max(24,Math.round(w*.075)));
    let sideLeft=safeLeft+rail, sideRight=safeRight+rail;
    if(landscape){
      sideLeft=Math.max(sideLeft,hud.right+13);
      sideRight=Math.max(sideRight,w-controls.left+13);
    }
    const usableWidth=w-sideLeft-sideRight;
    this.cell=Math.floor(Math.max(1,Math.min(usableWidth/N,(bottom-top)/N,80)));
    this.left=Math.floor(sideLeft+(usableWidth-this.cell*N)/2);
    this.top=Math.floor((top+bottom-this.cell*N)/2);
    const drive=$('overdrive-status');
    drive.dataset.compact=String(landscape||h<530);
    drive.style.setProperty('--drive-width',(landscape?hud.width:this.cell*N)+'px');
    let height=drive.offsetHeight;
    if(!landscape){
      if(this.top-hudBottom<height+17&&drive.dataset.compact==='false'){
        drive.dataset.compact='true';
        height=drive.offsetHeight;
      }
      const minTop=Math.ceil(hudBottom+height+15);
      this.top=Math.max(this.top,minTop);
      if(this.top+this.cell*N+16>controlsTop){
        // Only a viewport shorter than the combined panels needs a smaller grid.
        this.cell=Math.max(1,Math.min(this.cell,Math.floor((controlsTop-this.top-16)/N)));
        this.left=Math.floor(sideLeft+(usableWidth-this.cell*N)/2);
        drive.style.setProperty('--drive-width',this.cell*N+'px');

    drive.style.setProperty('--drive-x',(landscape?hud.left:this.left)+'px');
    drive.style.setProperty('--drive-y',(landscape?hudBottom+12:this.top-height-9)+'px');
    this.meterLift=landscape?0:Math.max(0,Math.floor(controlsTop-this.top-this.cell*N-43));

  animateCity(time){
    let coverage=0,sun=0,lights=0,night=0,reflection=0,depth=0,halo=0;
    for(let i=0;i<CITY_PHASES.length;i++){
      const weight=cityMix[i], phase=CITY_PHASES[i];
      coverage+=weight;
      this.skies[i].setVisible(weight>.001).setAlpha(coverage?weight/coverage:0);
      sun+=weight*phase.sun;
      lights+=weight*phase.lights;
      night+=weight*phase.night;
      reflection+=weight*phase.reflection;
      depth+=weight*phase.depth;
      halo+=weight*phase.halo;
    }
    this.sun.setAlpha(sun*(.94+.06*Math.sin(time/1600)));
    this.stars.setAlpha(.13+night);
    this.cityShade.setAlpha(night);
    const subdued=reducedMotion.matches;
    const active=playing&&elapsed<overUntil;
    const impact=subdued?0:cityImpact;
    const danger=playing?Math.max(0,(pressure-60)/40):0;
    const sway=subdued?0:Math.sin(time/3400);
    this.edgeDanger.setAlpha(danger*.79);
    for(let i=0;i<2;i++){
      const tint=phaseGlow(i);
      this.halos[i].setTint(tint).setAlpha(halo+.10+impact*.18+(active?.13:0));
      this.halos[i+2].setTint(tint).setAlpha((halo+.08+impact*.21)*reflection+(active?.15:0));
      const sweep=(time*.014+i*this.w*.57)%(this.w+120);
      this.beams[i].setVisible(!subdued).setTint(tint)
        .setPosition(i===0?sweep-60:this.w+60-sweep,this.horizon-9+i*20)
        .setRotation(i===0?-.16:.14).setAlpha(.22+night*.22+impact*.17);
    }
    this.warmSpill.setAlpha(danger*.82);
    this.edgeElectric.setAlpha(active?(subdued?.62:.77+.09*Math.sin(time/310)):impact*.79);
    this.neonSpill.setAlpha(active?.87:impact*.58);
    this.lightSweep.setVisible(!subdued).setX(time*.025%(this.w+135)-65).setAlpha(.59+impact*.31);
    this.cityWindows.setAlpha(Math.min(1,lights*(.82+(subdued?0:.16*Math.sin(time/1260)))+impact*.35+(active?.16:0)));
    this.sideLights.setAlpha(Math.min(1,lights*(.82+(subdued?0:.18*Math.sin(time/1020)))+impact*.29+(active?.19:0)));
    this.streetGlow.setAlpha(Math.min(1,reflection*(.82+(subdued?0:.17*Math.sin(time/1420)))+impact*.34+(active?.17:0)));
    this.sun.setX(depth*2.6*sway);
    this.city.setX(depth*1.2*sway);
    this.cityShade.setX(this.city.x);
    this.cityWindows.setX(this.city.x);
    this.glass.setAlpha(.42+(subdued?0:.15*Math.sin(time/1950))+impact*.23);
    this.palms.forEach((p,i)=>p.setRotation((subdued?0:Math.sin(time/1900+i))*.025*depth));
    this.traffic.forEach((car,i)=>{
      const travel=(time*(i===0?.043:.036)+i*this.w*.47)%(this.w+115);
      car.setPosition(i===0?travel-55:this.w+55-travel,this.horizon+46+i*8);
    });
    this.signs.forEach((sign,i)=>sign.setAlpha(Math.min(1,lights*(.93+(subdued?0:.07*Math.sin(time/960+i)))+impact*.4+(active?.15:0))).setX(sign.homeX+1.5*sway));
  }
}
