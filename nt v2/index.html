  announcementQueue=announcementQueue.filter(item=>item.style!==style);

function burst(cells,color,intensity){
  const {cell,left,top,particles}=scene;
  let cursor=0;
  for(const [x,y] of cells){
    for(let i=0;i<intensity+2;i++){
      while(cursor<particles.length&&particles[cursor].visible)cursor++;
      if(cursor===particles.length)return;
      const p=particles[cursor++];
      const angle=Math.random()*Math.PI*2;
      const distance=cell*(reducedMotion.matches?.18+Math.random()*.26:.31+Math.random()*.83);
      const cx=left+(x+.5)*cell,cy=top+(y+.5)*cell;
      p.setPosition(cx,cy).setFillStyle(color).setAlpha(1)
        .setScale((i===0&&intensity>=2?2.2:.72)+Math.random(),i===0?.46:.85).setRotation(angle).setVisible(true);
      scene.tweens.add({targets:p,x:cx+Math.cos(angle)*distance,y:cy+Math.sin(angle)*distance,
        alpha:0,scale:0,duration:150+Math.random()*110,onComplete:()=>p.setVisible(false)});
    }
  }
}

function findGroup(x,y,seen){
  const color=board[y][x], stack=[[x,y]], group=[];
  while(stack.length){
    const [a,b]=stack.pop(), key=b*N+a;
    if(a<0||a>=N||b<0||b>=N||seen.has(key)||board[b][a]!==color)continue;
    seen.add(key);
    group.push([a,b]);
    stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
  }
  return group;
}
// Label the connected components before each wave. Labels fall with their crystals.
function labelComponents(){
  const labels=Array.from({length:N},()=>Array(N).fill(0));
  const seen=new Set();
  let label=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(seen.has(y*N+x))continue;
    label++;
    for(const [a,b] of findGroup(x,y,seen))labels[b][a]=label;
  }
  return labels;
}
function collapse(groups,intensity=1){
  const labels=labelComponents();
  const columns=new Set(), moved=[];
  for(const group of groups){
    const [x,y]=group[0];
    burst(group,C[board[y][x]],intensity);
    for(const [a,b] of group){
      board[b][a]=-1;
      columns.add(a);
    }
  }
  for(const x of columns){
    let destination=N-1;
    for(let y=N-1;y>=0;y--){
      if(board[y][x]<0)continue;
      board[destination][x]=board[y][x];
      labels[destination][x]=labels[y][x];
      if(destination!==y)moved.push([x,destination,y]);
      destination--;
    }
    for(let y=destination;y>=0;y--){
      board[y][x]=rand();
      labels[y][x]=0;
      moved.push([x,y,y-destination-1]);
    }
  }
  paintBoard(moved);
  return {labels,moved};
}
function chainGroups({labels,moved}){
  const seen=new Set(), groups=[];
  for(const [x,y] of moved){
    if(seen.has(y*N+x))continue;
    const group=findGroup(x,y,seen);
    if(group.length<CHAIN_MIN)continue;
    const first=labels[y][x];
    if(first===0||group.some(([a,b])=>labels[b][a]!==first))groups.push(group);
  }
  return groups;
}
function resolveChain(fall,wave){

  });
}
function passivePressureBetween(fromMs,toMs){
  // Integrate the linear ramp, then accumulate at the capped rate.
  const rampFrom=Math.min(fromMs,PRESSURE.rampMs);
  const rampTo=Math.min(toMs,PRESSURE.rampMs);
  const averageRampFraction=(rampFrom+rampTo)/(2*PRESSURE.rampMs);
  const averageRampRate=PRESSURE.passiveStartPerSecond+
    (PRESSURE.passiveMaxPerSecond-PRESSURE.passiveStartPerSecond)*averageRampFraction;
  return (averageRampRate*(rampTo-rampFrom)+PRESSURE.passiveMaxPerSecond*(toMs-fromMs-rampTo+rampFrom))/1000;
}
function latePressureTarget(points){
  const fraction=(points-PRESSURE.lateScoreStart)/(PRESSURE.lateScoreCap-PRESSURE.lateScoreStart);
  return PRESSURE.lateMaxBonusPerSecond*Math.max(0,Math.min(1,fraction));
}
function latePressureFor(delta){
  // Ease toward the score-based bonus so even a large clear cannot jump the pressure rate.
  const target=latePressureTarget(score)*Math.min(1,elapsed/PRESSURE.rampMs);
  const previous=latePressureBonus;
  if(target===0&&previous===0)return 0;
  const response=PRESSURE.lateRateResponseMs;
  const blend=-Math.expm1(-delta/response);
  latePressureBonus=previous+(target-previous)*blend;
  // Integrate the easing curve over the frame.
  return (target*delta+(previous-target)*response*blend)/1000;
}
function pressureForGroup(size){
  if(size<PRESSURE.largeGroupMinSize)return PRESSURE.manualBySize[size];
  const extra=size-PRESSURE.largeGroupMinSize;
  return -Math.min(PRESSURE.maxGroupCooling,PRESSURE.largeGroupBaseCooling+extra*PRESSURE.extraGemCooling);
}
function comboPoints(size){
  const base=10*size*size;

  return base+Math.floor(base*steps*Math.min(size-1,5)/25);
}
function updateCombo(size){
  if(elapsed-lastMove>=COMBO_MS){
    combo=0;
    qualityMoves=0;
    comboTier=0;
  }
  combo=Math.min(combo+1,12);
  lastMove=elapsed;
  if(size>=4)qualityMoves++;
  if(size>=4&&combo>=6&&qualityMoves>=3&&comboTier<3){
    comboTier=3;
    return 3;
  }
  if(size>=4&&combo>=4&&qualityMoves>=2&&comboTier<2){
    comboTier=2;

  }
  return combo>=2?1:0;
}
function energyForGroup(size,reward){

}
function tap(x,y){

  }else if(reward===2){

  update(time,delta){
    if(runMode==='paused')return;
    if(!playing){
      activeSkin.environment.animate(this,time);
      return;
    }
    elapsed+=delta;
    activeSkin.environment.update();
    if(noticeUntil&&elapsed>=noticeUntil){
      $('achievement-notice').hidden=true;
      noticeUntil=0;
    }
    updateAnnouncements();
    cityImpact=Math.max(0,cityImpact-delta/570);
    updateScoreDisplay();
    updateDashboardLight();
    activeSkin.environment.animate(this,time);
    const previousPressure=Math.floor(pressure);
    changePressure(passivePressureBetween(elapsed-delta,elapsed)+latePressureFor(delta));
    if(!playing)return;
    const second=Math.floor(elapsed/1000);
    if(second>lastRunSecond){
      lastRunSecond=second;
      trackAchievement('runSeconds',second);
    }
    updateTension();
    updateMusicMix(delta);
    const comboExpired=combo>0&&elapsed-lastMove>=COMBO_MS;
    if(comboExpired)combo=0;
    const reactorTick=elapsed<recoverUntil?Math.floor((elapsed<overUntil?overUntil-elapsed:recoverUntil-elapsed)/100):0;
    const reactorChanged=reactorTick!==lastReactorTick;
    lastReactorTick=reactorTick;
    const crossedOverdriveEnd=elapsed-delta<overUntil&&elapsed>=overUntil;
    const crossedRecoveryEnd=elapsed-delta<recoverUntil&&elapsed>=recoverUntil;
    if(crossedOverdriveEnd){
      cityImpact=Math.max(cityImpact,.53);
      flash('OVERDRIVE ENDED','end');
      sound(220,.24,'triangle',.028);
    }
    if(comboExpired||previousPressure!==Math.floor(pressure)||reactorChanged||crossedOverdriveEnd||crossedRecoveryEnd)updateHud();
    if(elapsed>=nextDisturbance&&!busy){
      nextDisturbance+=DISTURBANCE_MS;
      for(let i=0;i<3;i++)board[Phaser.Math.Between(0,N-1)][Phaser.Math.Between(0,N-1)]=rand();
      paintBoard();
      flash('REACTOR SHIFT');
      sound(210,.23,'triangle',.025);
    }
  }
  layout(){
    const {width:w,height:h}=this.scale;
    const landscape=w>=600&&h<=500&&w>h;
    const hud=$('hud').getBoundingClientRect();
    const controls=$('bottom').getBoundingClientRect();
    const comboBottom=$('combo').getBoundingClientRect().bottom;
    const hudBottom=Math.max(hud.bottom,comboBottom<h*.45?comboBottom:0);
    this.w=w;
    this.h=h;
    const insets=getComputedStyle($('game'));
    const safeLeft=parseFloat(insets.getPropertyValue('--safe-left'))||0;
    const safeRight=parseFloat(insets.getPropertyValue('--safe-right'))||0;
    const widerPortrait=w>=380&&w<=600&&h>=650&&h>w;
    const rail=widerPortrait?Math.max(20,Math.round(w*.048)):Math.min(54,Math.max(24,Math.round(w*.075)));
    let sideLeft=safeLeft+rail,sideRight=safeRight+rail;
    if(landscape){
      sideLeft=Math.max(sideLeft,hud.right+13);
      sideRight=Math.max(sideRight,w-controls.left+13);
    }
    const stack=$('reactor-stack'), drive=$('overdrive-status');
    const compact=landscape||h<530;
    stack.dataset.compact=drive.dataset.compact=String(compact);
    const usableWidth=w-sideLeft-sideRight;
    const maxCell=Math.floor(Math.min(usableWidth/N,80));
    stack.style.setProperty('--stack-width',(landscape?hud.width:Math.max(1,maxCell)*N)+'px');
    const stackHeight=stack.offsetHeight;
    const minTop=landscape?15:Math.ceil(hudBottom+stackHeight+17);
    const bottom=landscape?h-16:Math.min(h-16,controls.top-15);
    this.cell=Math.max(1,Math.min(maxCell,Math.floor((bottom-minTop)/N)));
    const span=this.cell*N;
    this.left=Math.floor(sideLeft+(usableWidth-span)/2);
    this.top=landscape?Math.floor((minTop+bottom-span)/2):
      Math.floor(Math.max(minTop,Math.min(h*.348,bottom-span)));
    stack.style.setProperty('--stack-width',(landscape?hud.width:span)+'px');
    stack.style.setProperty('--stack-x',(landscape?hud.left:this.left)+'px');
    stack.style.setProperty('--stack-y',(landscape?hudBottom+12:this.top-stackHeight-9)+'px');
    this.positionArcadeFX();
    this.paintReactorFX();
    activeSkin.environment.paint(this);
    if(runMode!=='menu')paintBoard();

  animateCity(time){
    let coverage=0,sun=0,lights=0,night=0,reflection=0,depth=0,halo=0,sunDrop=0;
    for(let i=0;i<CITY_PHASES.length;i++){
      const weight=cityMix[i], phase=CITY_PHASES[i];
      coverage+=weight;
      const opacity=coverage?weight/coverage:0;
      this.skies[i].setVisible(weight>.001).setAlpha(opacity);
      this.coasts[i].setVisible(weight>.001).setAlpha(opacity);
      sunDrop+=weight*phase.sunDrop;
      sun+=weight*phase.sun;
      lights+=weight*phase.lights;
      night+=weight*phase.night;
      reflection+=weight*phase.reflection;
      depth+=weight*phase.depth;
      halo+=weight*phase.halo;
    }
    this.sun.setAlpha(sun*(.94+.06*Math.sin(time/1600)));
    this.stars.setAlpha(.13+night);
    this.cityShade.setAlpha(night);
    const subdued=reducedMotion.matches;
    const active=playing&&elapsed<overUntil;
    const impact=subdued?0:cityImpact;
    const danger=playing?Math.max(0,(pressure-60)/40):0;
    const sway=subdued?0:Math.sin(time/3400);
    this.edgeDanger.setAlpha(danger*.79);
    this.edgeElectric.setVisible(runMode!=='menu');
    if(runMode==='menu'){
      this.menuLights.setAlpha(subdued?.86:.82+.12*Math.sin(time/2100));
      this.animateMiamiMenu(time,subdued);
      this.animateMenuLife(time,subdued);
    }
    if(this.recordFireworks.visible){
      const ratio=(elapsed-this.fireworksAt)/940;
      if(!playing||subdued||ratio<0||ratio>=1)this.recordFireworks.setVisible(false);
      else this.recordFireworks.setAlpha(1-ratio).setY(ratio*7);
    }
    for(let i=0;i<2;i++){
      const tint=phaseGlow(i);
      if(tint!==this.cockpitColors[i]){
        this.cockpitColors[i]=tint;
        const color='#'+tint.toString(16).padStart(6,'0');
        this.cockpit.style.setProperty(i===0?'--cockpit-warm':'--cockpit-cool',color);
      }
      this.halos[i].setTint(tint).setAlpha(halo+.10+impact*.18+(active?.13:0));
      this.halos[i+2].setTint(tint).setAlpha((halo+.08+impact*.21)*reflection+(active?.15:0));
      const sweep=(time*.014+i*this.w*.57)%(this.w+120);
      this.beams[i].setVisible(!subdued).setTint(tint)
        .setPosition(i===0?sweep-60:this.w+60-sweep,this.horizon-9+i*20)
        .setRotation(i===0?-.16:.14).setAlpha(.22+night*.22+impact*.17);
    }
    this.warmSpill.setAlpha(danger*.82);
    this.edgeElectric.setAlpha(active?(subdued?.62:.77+.09*Math.sin(time/310)):impact*.79);
    this.neonSpill.setAlpha(active?.87:impact*.58);
    this.lightSweep.setVisible(!subdued).setX(time*.025%(this.w+135)-65).setAlpha(.59+impact*.31);
    this.cityWindows.setAlpha(Math.min(1,lights*(.80+(subdued?0:.12*Math.sin(time/1260)))+night*.21+impact*.35+(active?.16:0)));
    this.sideLights.setAlpha(Math.min(1,lights*(.82+(subdued?0:.18*Math.sin(time/1020)))+impact*.29+(active?.19:0)));
    this.streetGlow.setAlpha(Math.min(1,reflection*(.82+(subdued?0:.17*Math.sin(time/1420)))+impact*.34+(active?.17:0)));
    this.sun.setPosition(depth*2.6*sway,this.sunRadius*sunDrop);
    this.surf.setPosition(subdued?0:Math.sin(time/2300)*4,subdued?0:Math.sin(time/3200)*2)
      .setAlpha(.64+night*.26+(subdued?0:.07*Math.sin(time/1850)));
    this.beachLife.setAlpha(1-night*.44);
    const waterfront=this.h-this.beachPathStart;
    this.walkers.forEach((walker,i)=>{
      const progress=subdued?(i+1)/5:(time/(13000+i*2200)+i*.27)%1;
      const depth=i%2===0?progress:1-progress;
      const scale=.38+depth*.48;
      const direction=i%2===0?-1:1;
      walker.setVisible(waterfront>=64&&runMode!=='menu')
        .setPosition(this.w*(.79-.21*depth)+(i%2)*17,this.beachPathStart+waterfront*(.12+.72*depth))
        .setScale(scale*direction,scale)
        .setAlpha((1-night*.37)*Math.min(1,progress*8,(1-progress)*8));
      const step=subdued?0:Math.floor((time+i*83)/180)%2;
      if(walker.texture.key!=='beach-step-'+step)walker.setTexture('beach-step-'+step);
    });
    this.city.setX(depth*1.2*sway);
    this.cityShade.setX(this.city.x);
    this.cityWindows.setX(this.city.x);
    this.glass.setAlpha(.42+(subdued?0:.15*Math.sin(time/1950))+impact*.23);
    this.palms.forEach((p,i)=>p.setRotation((subdued?0:Math.sin(time/1900+i))*.025*depth));
    this.traffic.forEach((car,i)=>{
      const travel=(time*(i===0?.043:.036)+i*this.w*.47)%(this.w+115);
      car.setPosition(i===0?travel-55:this.w+55-travel,this.horizon+46+i*8)
        .setVisible(runMode!=='menu'&&(i===0?travel-55:this.w+55-travel)>this.w*.69);
    });
    this.signs.forEach((sign,i)=>sign.setAlpha(Math.min(1,lights*(.93+(subdued?0:.07*Math.sin(time/960+i)))+impact*.4+(active?.15:0))).setX(sign.homeX+1.5*sway));
  }
}

function drawMiamiMap(container){
  const frame=document.createElement('div'), canvas=document.createElement('canvas');
  frame.className='pixel-map';
  canvas.width=240;canvas.height=120;
  canvas.setAttribute('role','img');
  canvas.setAttribute('aria-label','World map with a playable destination in Miami, Florida');
  const ctx=canvas.getContext('2d'),land=atob(WORLD_LAND),image=ctx.createImageData(240,120);
  const isLand=(x,y)=>x>=0&&x<240&&y>=0&&y<120&&(land.charCodeAt(y*30+(x>>3))&(128>>(x&7)))!==0;
  for(let y=0;y<120;y++)for(let x=0;x<240;x++){
    const filled=isLand(x,y);
    const edge=filled&&(!isLand(x+1,y)||!isLand(x-1,y)||!isLand(x,y+1)||!isLand(x,y-1));
    const grid=x%20===0||y%15===0;
    const color=edge?[241,87,168]:filled?(grid?[25,37,68]:[13,25,48]):grid?[37,118,147]:[20,86,117];
    const at=(y*240+x)*4;
    image.data.set(color,at);
    image.data[at+3]=255;
  }
  ctx.putImageData(image,0,0);
  frame.append(canvas);
  const miami=document.createElement('button');
  miami.className='map-destination';
  miami.type='button';
  miami.setAttribute('aria-label','Select Miami 1986 on the map');
  miami.onclick=()=>selectSkin(SKINS.miami);
  frame.append(miami);
  for(const [x,y] of [[52,29],[72,42],[81,66]]){
    const node=document.createElement('span');
    node.className='map-mystery';
    node.textContent='?';
    node.setAttribute('aria-hidden','true');
    node.style.left=x+'%';node.style.top=y+'%';
    frame.append(node);
  }
  const caption=document.createElement('p');
  caption.textContent='MIAMI 1986 · PLAYABLE   /   ? · UNCHARTED';
  container.append(frame,caption);
}
function renderWorldMap(){
  const list=$('world-list'),presentation=$('world-presentation');
  list.replaceChildren();
  presentation.replaceChildren();
  activeSkin.menu.worldMap?.(presentation);
  for(const category of WORLD_CATEGORIES){
    const group=document.createElement('section'), title=document.createElement('h3');
    group.className='world-group';
    title.textContent=category.title;
    group.append(title);
    for(const skin of Object.values(SKINS).filter(skin=>skin.worldCategory===category.id)){
      const tile=document.createElement(skin.available?'button':'div');
      tile.className='world-tile';
      const name=document.createElement('strong'), status=document.createElement('small');
      name.textContent=skin.name;
      status.textContent=skin.available?(skin===activeSkin?'Playable · Selected':'Playable'):'Planned · Unavailable';
      tile.append(name,status);
      if(skin.available)tile.onclick=()=>selectSkin(skin);
      group.append(tile);
    }
    const unknown=document.createElement('div');
    unknown.className='world-tile';
    unknown.textContent=category.unknown+' · Unknown';
    group.append(unknown);
    list.append(group);
  }
}
function selectSkin(skin){
  if(!skin.available)return;
  const changed=skin!==activeSkin;
  if(changed&&musicTrack){
    musicTrack.pause();
    musicTrack=null;
    musicFailed=musicNeedsGesture=false;
  }
  if(changed){
    stopMenuAmbience();
    optionalMenuTrack=null;
    optionalMenuFailed=false;
  }
  activeSkin=skin;
  settings.skin=skin.id;
  writeStore(SETTINGS_KEY,settings);
  applySkin();
  if(changed&&scene){
    $('start').disabled=true;
    scene.scene.restart();
  }
  showScreen('skins');
}
function renderSkins(){
  const list=$('skin-list');
  list.replaceChildren();
  for(const skin of Object.values(SKINS)){
    const tile=document.createElement('button');
    tile.className='skin-tile';
    tile.type='button';
    tile.disabled=!skin.available;
    tile.setAttribute('aria-pressed',String(skin===activeSkin));
    const name=document.createElement('strong'), detail=document.createElement('span');
    name.textContent=skin.name;
    detail.textContent=skin.category+' · '+(skin.available?(skin===activeSkin?'Selected':'Available'):'Coming soon');
    tile.append(name,detail);
    if(skin.available)tile.onclick=()=>selectSkin(skin);
    list.append(tile);
  }
}
function renderAchievements(){
  const definitions=achievementDefinitions(achievementFilter);
  const complete=definitions.filter(item=>unlocks[item.id]).length;
  $('achievement-count').textContent=complete+' / '+definitions.length+' unlocked';
  for(const button of document.querySelectorAll('[data-filter]')){
    button.setAttribute('aria-pressed',String(button.dataset.filter===achievementFilter));
    if(button.dataset.filter==='skin')button.textContent=activeSkin.name;
  }
  const list=$('achievement-list');
  list.replaceChildren();
  for(const item of definitions){
    const row=document.createElement('li'), title=document.createElement('strong'), detail=document.createElement('small');
    const unlocked=!!unlocks[item.id];
    row.dataset.unlocked=String(unlocked);
    title.textContent=item.secret&&!unlocked?'???':item.title;
    if(item.secret&&!unlocked){
      detail.textContent='Secret · Locked';
      row.append(title,detail);
      list.append(row);
      continue;
    }
    detail.textContent=item.description+' · '+(unlocked?'Unlocked':'Locked')+
      (item.goal>1?' · '+Math.min(item.goal,achievementProgress[item.scope+':'+item.stat]||0).toLocaleString('en-US')+' / '+item.goal.toLocaleString('en-US'):'');
    row.append(title,detail);
    list.append(row);
  }
}
function refreshOptions(){
  $('option-music').checked=musicEnabled;
  $('option-effects').checked=effectsEnabled;
  $('option-motion').checked=settings.reduceMotion;
  $('music-volume').value=settings.musicVolume;
  $('effects-volume').value=settings.effectsVolume;
  $('music-volume-value').textContent=settings.musicVolume+'%';
  $('effects-volume-value').textContent=settings.effectsVolume+'%';
}
function persistOptions(){
  writeStore(SETTINGS_KEY,settings);
  if(document.documentElement)document.documentElement.dataset.reduceMotion=String(settings.reduceMotion);
  $('music-toggle').setAttribute?.('aria-pressed',String(musicEnabled));
  $('effects-toggle').setAttribute?.('aria-pressed',String(effectsEnabled));
}
function setMusicEnabled(enabled){
  settings.music=musicEnabled=enabled;
  persistOptions();
  syncMusic(true);
  syncMenuAmbience(true);
}
function setEffectsEnabled(enabled){
  settings.effects=effectsEnabled=enabled;
  persistOptions();
  if(playing&&runMode!=='paused'&&effectsEnabled)unlockEffects();
  else if(effectsBus)effectsBus.gain.setTargetAtTime(0,audio.currentTime,.026);
}
function pauseRun(){
  if(!playing||runMode!=='playing')return;
  setMode('paused');
  scene.scene.pause();
  syncMusic();
  setTension(0);
  if(effectsBus)effectsBus.gain.setTargetAtTime(0,audio.currentTime,.026);
  showScreen('pause');
  $('resume-game').focus();
}
function resumeRun(){
  if(!playing||runMode!=='paused')return;
  setMode('playing');
  scene.scene.resume();
  unlockEffects();
  syncMusic(true);
  $('pause-game').focus();
}
function discardRun(keepMusic=false){
  playing=false;
  busy=false;
  if(settleEvent)settleEvent.remove();
  settleEvent=null;
  clearEffects();
  resetAnnouncements();
  $('achievement-notice').hidden=true;
  saveAchievements();
  setTension(0);
  if(!keepMusic){
    resetMusicFade();
    if(musicTrack){
      musicTrack.pause();
      musicTrack.currentTime=0;
    }
  }
}
function returnToMenu(){
  const wasPaused=runMode==='paused';
  const outgoing=musicTrack;
  const shouldFade=!!outgoing&&!outgoing.paused;
  discardRun(shouldFade);
  menuWaitingForGameplay=shouldFade;
  setMode('menu');
  $('overlay').hidden=true;
  board=[];
  activeSkin.environment.reset();
  cityImpact=0;
  scene.boardFrame.setVisible(false);
  scene.glass.setVisible(false);
  for(const gem of scene.gems)gem.setVisible(false);
  if(wasPaused)scene.scene.resume();
  scene.layout();
  showScreen('main');
  if(shouldFade){
    if(musicEnabled&&ensureAudio())menuAudioUnlocked=true;
    stopMusic(260,()=>{
      menuWaitingForGameplay=false;
      outgoing.currentTime=0;
      syncMenuAmbience();
    });
  }else syncMenuAmbience(true);
  $('start').focus();
}
function restartRun(){
  discardRun();
  scene.scene.resume();
  start();
}
$('start').onclick=()=>{if(scene){$('overlay').hidden=true;start()}};
$('pause-game').onclick=pauseRun;
$('resume-game').onclick=resumeRun;
$('restart-game').onclick=restartRun;
$('music-toggle').onclick=()=>setMusicEnabled(!musicEnabled);
$('effects-toggle').onclick=()=>setEffectsEnabled(!effectsEnabled);
$('option-music').onchange=event=>setMusicEnabled(event.target.checked);
$('option-effects').onchange=event=>setEffectsEnabled(event.target.checked);
$('option-motion').onchange=event=>{settings.reduceMotion=event.target.checked;persistOptions()};
$('music-volume').oninput=event=>{
  settings.musicVolume=Number(event.target.value);
  if(musicTrack)musicTrack.volume=musicVolume();
  syncMenuAmbience(true);
  refreshOptions();persistOptions();
};
$('effects-volume').oninput=event=>{
  settings.effectsVolume=Number(event.target.value);
  if(effectsBus&&effectsEnabled&&runMode==='playing')effectsBus.gain.setTargetAtTime(effectsVolume(),audio.currentTime,.026);
  refreshOptions();persistOptions();
};
if(document.body){
  applySkin();
  persistOptions();
  setMode('menu');
  $('arcade-menu').addEventListener('click',menuClick,true);
  $('secret-penthouse').onclick=()=>discoverMiami('penthouse','WELCOME TO MIAMI!');
  $('secret-jet').onclick=()=>discoverMiami('jet','NICE CATCH!');
  $('secret-radio').onclick=()=>discoverMiami('radio','THE CITY IS YOURS!');
  $('secret-umbrella').onclick=()=>playMenuDetail('umbrella');
  $('secret-car').onclick=()=>playMenuDetail('car');
  syncMiamiHotspots();
  for(const button of document.querySelectorAll('[data-screen]'))button.onclick=()=>{
    if(button.dataset.screen==='options')optionsBack=screen;
    showScreen(button.dataset.screen);
  };
  for(const button of document.querySelectorAll('[data-back]'))button.onclick=()=>showScreen(button.dataset.backTo||(screen==='options'?optionsBack:'main'));
  for(const button of document.querySelectorAll('[data-main]'))button.onclick=returnToMenu;
  for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{
    achievementFilter=button.dataset.filter;
    renderAchievements();
  };
}
window.addEventListener('visibilitychange',()=>{
  syncMusic();
  if(document.hidden){
    setTension(0);
    stopMenuAmbience();
  }else syncMenuAmbience();
});
window.addEventListener('pagehide',()=>{musicTrack?.pause();stopMenuAmbience();saveAchievements()});
window.addEventListener('pageshow',()=>{syncMusic();syncMenuAmbience()});
window.addEventListener('pointerdown',event=>{
  if(runMode!=='playing'||!playing||event.target.closest?.('button'))return;
  if(effectsEnabled&&audio?.state!=='running')unlockEffects();
  if(musicTrack?.paused&&musicEnabled&&!musicFailed)syncMusic(true);
},true);

})();
</script></body></html>
