}

#reactor-meter[data-danger="hot"]{--pressure:#ffad66;--pressure-tail:#c44c35}
#reactor-meter[data-danger="critical"]{--pressure:#ff668a;--pressure-tail:#b92c53}

#reactor-meter .meter-label{align-items:center;line-height:13px;white-space:nowrap}
#pressure-state{font-size:8px;letter-spacing:.05em;margin-left:auto}
#reactor-meter #pct{font-size:13px;color:var(--pressure);line-height:13px}
#reactor-meter .bar{background:#1c142a;border-color:currentColor;box-shadow:0 1px 0 #ffffff21}
#reactor-meter .pressure{background:linear-gradient(90deg,var(--pressure-tail),var(--pressure));box-shadow:0 0 9px var(--pressure)}

#overdrive-status[data-state="active"] .bar{border-color:#63f8ed;box-shadow:0 0 7px #6bfff36b}

#bottom{transform:translateY(calc(0px - var(--meter-lift,0px)))}
/* Shared smoked-glass modules with machined edges. */
#hud,#bottom{isolation:isolate;border-color:#8a9ec97a;background:linear-gradient(145deg,#332645f7 0%,#1c2037f7 37%,#11192ef7 100%);box-shadow:inset 0 1px #f7dfff2b,inset 0 -2px #0d1020,0 5px 14px #09081787}
#hud::before,#bottom::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:-1px 0 #62ffe590,1px 0 #ff69b48a,inset 0 1px #dbf4ff3a;opacity:.72;transition:opacity .24s ease,box-shadow .24s ease}
#hud .brand{color:#fff5fb;text-shadow:0 1px 0 #090b1c;letter-spacing:.1em}
#hud .subtitle{color:#8cf9e2}
#score-module{position:relative;align-self:center;gap:10px;justify-content:space-between;height:36px;min-width:120px;padding:2px 8px 2px 9px;border-radius:8px;border:1px solid #aeb5e440;background:linear-gradient(155deg,#100e21,#101c32 75%);box-shadow:inset 0 1px 5px #050817,0 1px #d1c4fa34}

#score-module .stat-label{font-size:7px;letter-spacing:.16em;color:#c9bde5;line-height:8px}
#score,#best{font-variant-numeric:tabular-nums lining-nums;letter-spacing:.02em;white-space:nowrap}
#score{font-size:clamp(19px,6.2vw,29px);line-height:22px;color:#f4feff;text-shadow:0 0 9px #71f5fd6d}

.best-readout{padding-left:7px;border-left:1px solid #b3b0e431}
#hud[data-surge="true"]::before,#bottom[data-surge="true"]::before,#bottom[data-overdrive="active"]::before{opacity:1;box-shadow:-1px 0 #6bfff4,1px 0 #ff82c9,inset 0 0 8px #77f2ff4c,0 0 12px #78f3ff55}

#bottom{border-radius:14px}
#reactor-meter .meter-label,#overdrive-status .meter-label{line-height:13px;align-items:center}
#reactor-meter .meter-label>span:first-child{color:#f2eaf9}
#reactor-meter .bar{position:relative;box-shadow:inset 0 1px 3px #040510,0 0 5px color-mix(in srgb,var(--pressure),transparent 65%)}
#reactor-meter .bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 1px),#170e25 calc(8.333% - 1px) 8.333%)}
#reactor-meter[data-danger="critical"] .meter-label,#reactor-meter[data-danger="maximum"] .meter-label{filter:drop-shadow(0 0 3px #ff466366)}
#overdrive-status{color:#8df7fa}
#overdrive-status .bar{position:relative;border-color:#6fe3e967;background:#0a1423}
#overdrive-status .energy{position:relative;overflow:hidden;background:linear-gradient(90deg,#7260cf,#6bf8f3 78%,#d4fffb);box-shadow:0 0 8px #51f4ff88}
#overdrive-status[data-state="active"]{color:#d3fffd}
#overdrive-status[data-state="active"] .energy::after{content:"";position:absolute;inset:0;width:55%;background:linear-gradient(100deg,transparent,#ffffffa6,transparent);animation:energy-flow 1.1s linear infinite}
#overdrive-status[data-state="recovery"] .energy{background:linear-gradient(90deg,#49386c,#c69bfb)}
@keyframes energy-flow{from{transform:translateX(-100%)}to{transform:translateX(190%)}}
#arcade-fx{position:fixed;z-index:3;left:var(--board-center-x,-100%);top:var(--board-center-y,-100%);width:var(--board-fx-span,0px);transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none;visibility:hidden;--fx:#70fff1;--hit:#e674b8;--headline:clamp(16px,calc(var(--board-fx-span) * .067),31px)}
#arcade-fx.show{visibility:visible}
.fx-seal{position:relative;display:grid;justify-items:center;align-items:center;min-width:0;max-width:100%;isolation:isolate;text-align:center;padding:5px 7px}
.fx-seal::before{content:"";position:absolute;z-index:-1;inset:-7px -14px;border-radius:50%;background:radial-gradient(ellipse,#120d2af5 7%,#150f2a92 51%,transparent 74%)}
#announcement{display:block;max-width:100%;font-size:var(--headline);line-height:1;font-weight:950;font-style:italic;letter-spacing:.023em;color:#fff8fc;white-space:nowrap;-webkit-text-stroke:1px #1d1235;paint-order:stroke fill;text-shadow:1px 2px #291844,0 0 10px var(--fx),0 0 20px var(--hit)}
#announcement-points{margin-top:5px;color:var(--fx);font-size:clamp(11px,calc(var(--board-fx-span) * .042),21px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.12em;text-shadow:0 1px 2px #160a2c,0 0 8px var(--fx)}
#announcement-points:empty{display:none}
.fx-arc{display:none;position:absolute;z-index:-1;top:37%;width:41%;height:22px;background:var(--fx);clip-path:polygon(0 76%,36% 59%,28% 35%,60% 37%,59% 12%,100% 0,70% 29%,77% 50%,43% 49%,49% 68%);opacity:.77}
.fx-arc-left{right:66%;transform:rotate(-13deg)}
.fx-arc-right{left:66%;transform:rotate(167deg)}
#arcade-fx[data-effect="super"]{--fx:#77ffef;--hit:#43a9ff;--headline:clamp(20px,calc(var(--board-fx-span) * .084),45px)}
#arcade-fx[data-effect="mega"]{--fx:#ffda9c;--hit:#ff4dbd;--headline:clamp(22px,calc(var(--board-fx-span) * .102),55px)}
#arcade-fx[data-effect="overdrive"]{--fx:#8ffff9;--hit:#fa64c9;--headline:clamp(24px,calc(var(--board-fx-span) * .114),61px)}
#arcade-fx[data-effect="critical"]{--fx:#ff8e9c;--hit:#ea3a62}
#arcade-fx.show .fx-seal{animation:fx-standard var(--fx-time) cubic-bezier(.17,.78,.24,1) both}
#arcade-fx.show:is([data-effect="super"],[data-effect="mega"],[data-effect="overdrive"]) .fx-arc{display:block}
#arcade-fx.show .fx-arc{animation:fx-lightning var(--fx-time) ease-out both}
#arcade-fx.show #announcement-points{animation:fx-points var(--fx-time) both}
#arcade-fx.show[data-effect="super"] .fx-seal{animation-name:fx-super}
#arcade-fx.show[data-effect="mega"] .fx-seal{animation-name:fx-mega}
#arcade-fx.show[data-effect="overdrive"] .fx-seal{animation-name:fx-overdrive}
@keyframes fx-standard{0%{opacity:0;transform:translateY(8px) scale(.82)}23%{opacity:1;transform:scale(1.075)}65%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-13px) scale(.95)}}
@keyframes fx-super{0%{opacity:0;transform:translateX(36%) skewX(-18deg)}23%{opacity:1;transform:translateX(-4%) skewX(-5deg)}64%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-18%) skewX(-12deg)}}
@keyframes fx-mega{0%{opacity:0;transform:translate(29%,-42px) rotate(-15deg) scale(.76)}24%{opacity:1;transform:translate(-4%,4px) rotate(-6deg) scale(1.13)}66%{opacity:1;transform:rotate(-3deg)}100%{opacity:0;transform:translate(-17%,23px) rotate(-8deg) scale(1.02)}}
@keyframes fx-overdrive{0%{opacity:0;transform:scale(.53,1.24)}22%{opacity:1;transform:scale(1.11)}67%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.16,.89)}}
@keyframes fx-points{0%,16%{opacity:0;transform:translateY(7px)}35%,71%{opacity:1;transform:none}100%{opacity:.4;transform:translateY(-9px)}}
@keyframes fx-lightning{0%,100%{opacity:0}21%{opacity:.88}59%{opacity:.21}}
@media(max-width:360px){#pressure-state{font-size:7px}#reactor-meter .meter-label,#overdrive-status .meter-label{letter-spacing:0}#score-module{gap:5px;min-width:101px;padding-inline:5px}.best-readout{padding-left:4px}}
@media(min-width:600px) and (max-height:500px) and (orientation:landscape){#pressure-state{display:none}#reactor-meter .meter-label{font-size:8px;letter-spacing:.025em}#score-module{justify-content:space-between}#score{font-size:21px}}

/* A separate ink and luminous fill keep the four feedback tiers readable. */
#arcade-fx{--ink:#b1fff7;--ink-hi:#ecfffa;--ink-low:#25e6f1;--outline:#10122e}
#arcade-fx[data-effect="super"]{--ink:#ffd45c;--ink-hi:#fff3aa;--ink-low:#ff9d35;--fx:#ffcc62;--hit:#ff780e}
#arcade-fx[data-effect="mega"]{--ink:#ff63be;--ink-hi:#ffd266;--ink-low:#ff42af;--fx:#ff69ca;--hit:#e139a5}
#arcade-fx[data-effect="overdrive"]{--ink:#55ffe3;--ink-hi:#dcf8ff;--ink-low:#22ddf1;--fx:#64f9f5;--hit:#cb66ff}
#arcade-fx[data-effect="critical"]{--ink:#ff99a7;--ink-hi:#ffe5d7;--ink-low:#ff768e}
#announcement{color:var(--ink);text-shadow:1px 2px var(--outline),0 0 7px var(--fx)}
@supports (background-clip:text){
  #announcement{background:linear-gradient(168deg,var(--ink-hi) 8%,var(--ink) 34%,var(--ink-low) 84%) 50% 50% / 100% 155%;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:.85px #17102d;filter:drop-shadow(0 2px 1px #0f0e27) drop-shadow(0 0 4px var(--fx))}
  #arcade-fx.show #announcement{animation:ink-sheen var(--fx-time) ease-out both}
}
@keyframes ink-sheen{0%{background-position:50% 0%}34%{background-position:50% 100%}100%{background-position:50% 60%}}

#overdrive-status[data-level="1"]{--reservoir-glow:#78aeff;--reservoir-tip:#6cf8fa}
#overdrive-status[data-level="2"]{--reservoir-glow:#71fff1;--reservoir-tip:#b4fffb}

#overdrive-status .energy-reservoir{isolation:isolate;overflow:hidden;border-color:#a99ce7a6;box-shadow:inset 0 1px 2px #05071f,0 0 5px #a891ff46;background:linear-gradient(#181932,#10172d)}
#overdrive-status .energy-reservoir::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),#171334c9 calc(12.5% - 1px) 12.5%),repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#eff8ffc4 calc(25% - 1px) 25%);background-blend-mode:screen}
#overdrive-status .energy{background:linear-gradient(180deg,#fff5ff64,transparent 48%,#150f3a55),linear-gradient(90deg,#9561fa,#47e8ef 55%,#ff68d2);box-shadow:0 0 6px var(--reservoir-glow);border-radius:2px}
#overdrive-status .energy::before{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--reservoir-tip);box-shadow:0 0 4px 1px var(--reservoir-tip)}
#overdrive-status[data-level="2"] .energy::after,#overdrive-status[data-level="3"] .energy::after,#overdrive-status[data-state="active"] .energy::after{content:"";position:absolute;inset:0;width:46%;background:radial-gradient(ellipse at 20% 23%,#fff 0 1px,transparent 2px),radial-gradient(ellipse at 59% 74%,#fff 0 1px,transparent 2px),linear-gradient(103deg,transparent,#fff8,transparent);animation:reservoir-flow 1.9s linear infinite}

#overdrive-status .energy{background:linear-gradient(180deg,#ffffff86 0%,#ffffff16 37%,#32145044 53%,#12103077),linear-gradient(90deg,#ad67ff,#31eff8 49%,#f864e2);box-shadow:0 0 8px var(--reservoir-glow)}

function getMusicTrack(){
  if(musicTrack)return musicTrack;
  const track=new Audio();
  track.preload='none';
  track.loop=true;
  track.volume=MUSIC_VOLUME;
  track.addEventListener('error',reportMusicError);
  track.addEventListener('playing',()=>{
    musicNeedsGesture=false;
    musicFailed=false;
    setMusicStatus('Miami Reactor soundtrack');
  });
  track.src=MUSIC_PATH;
  musicTrack=track;
  return track;
}
function syncMusic(fromGesture=false){
  if(!playing||!musicEnabled||document.hidden){
    musicTrack?.pause();
    return;
  }
  if(typeof Audio!=='function'||(!fromGesture&&(musicFailed||musicNeedsGesture)))return;
  // The same media element handles play, pause and looping for every run.
  const track=getMusicTrack();
  if(!track.paused)return;
  if(musicFailed){
    musicFailed=false;
    track.load();
  }
  track.play().catch(error=>{
    if(!playing||!musicEnabled||document.hidden||error.name==='AbortError')return;
    if(error.name==='NotAllowedError'){
      musicNeedsGesture=true;
      setMusicStatus('Tap the game to resume music.');
    }else reportMusicError();
  });
}
function resetMusicFade(){

}
function stopMusic(){
  if(!musicTrack)return;
  if(musicTrack.paused)return;
  const start=performance.now(), volume=musicTrack.volume;
  const fade=now=>{
    const remaining=Math.max(0,1-(now-start)/540);
    musicTrack.volume=volume*remaining**2;
    if(remaining>0)musicFade=requestAnimationFrame(fade);
    else{
      musicFade=0;
      musicTrack.pause();
    }
  };
  musicFade=requestAnimationFrame(fade);
}
function unlockEffects(){
  if(!effectsEnabled)return;
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  if(!audio){
    audio=new Context();
    effectsBus=audio.createGain();
    tensionBus=audio.createGain();
    tensionBus.gain.value=0;
    tensionBus.connect(effectsBus);
    const limiter=audio.createDynamicsCompressor();
    limiter.threshold.value=-12;
    limiter.ratio.value=5;
    effectsBus.connect(limiter);
    limiter.connect(audio.destination);
  }
  const now=audio.currentTime;
  effectsBus.gain.setTargetAtTime(EFFECTS_VOLUME,now,.026);
  if(audio.state!=='running')audio.resume().catch(()=>{});
}
function sound(frequency,duration=.14,type='triangle',volume=.035,offset=0,endFrequency=0,bus=effectsBus){
  if(!audio||!effectsEnabled||audio.state!=='running')return;
  const when=audio.currentTime+.004+offset;
  const oscillator=audio.createOscillator();
  const gain=audio.createGain();
  oscillator.type=type;
  oscillator.frequency.setValueAtTime(frequency,when);
  if(endFrequency)oscillator.frequency.exponentialRampToValueAtTime(endFrequency,when+duration*.9);
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(volume,when+Math.min(.021,duration*.4));
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  oscillator.connect(gain).connect(bus);
  oscillator.start(when);
  oscillator.stop(when+duration+.01);
}
function setTension(level){
  if(!tensionBus||level===tensionLevel)return;
  tensionLevel=level;
  tensionBus.gain.setTargetAtTime(level*.70,audio.currentTime,.23);
}
function updateTension(){
  if(!tensionBus||audio.state!=='running')return;
  const target=effectsEnabled&&playing&&!document.hidden?Math.max(0,Math.min(1,(pressure-52)/44)):0;
  if(target===0||Math.abs(target-tensionLevel)>.035)setTension(target);
  if(target<=0||elapsed<nextTensionAt)return;
  nextTensionAt=elapsed+1100-target*555;
  sound(76,.18,'sine',.079,0,45,tensionBus);
  if(target>.60)sound(132,.079,'triangle',.032,.115,88,tensionBus);
}
function pressureState(value){

function flash(message,style='notice'){
  const [priority,duration]=ANNOUNCEMENTS[style];
  const escalating=style==='combo'||style==='super'||style==='mega'||style==='chain';
  const growth=escalating?Math.min(1.28,1+Math.max(0,combo-2)*.03):1;
  const comboLevel=style==='combo'||style==='super'||style==='mega'?combo:0;
  const event={message,style,priority,duration,growth,comboLevel,expires:elapsed+1750};
  if(!currentAnnouncement||priority>currentAnnouncement.priority){
    if(currentAnnouncement&&currentAnnouncement.style==='mega'){
      announcementQueue=announcementQueue.filter(item=>item.style!==currentAnnouncement.style);
      announcementQueue.push(currentAnnouncement);
      announcementQueue.sort((a,b)=>b.priority-a.priority);
      announcementQueue.length=Math.min(announcementQueue.length,3);
    }
    showAnnouncement(event);
    return;
  }
  if(priority<3)return;
  announcementQueue=announcementQueue.filter(item=>item.style!==style);
  announcementQueue.push(event);
  announcementQueue.sort((a,b)=>b.priority-a.priority);
  announcementQueue.length=Math.min(announcementQueue.length,3);
}
function updateAnnouncements(){
  if(!currentAnnouncement||elapsed<currentAnnouncement.until)return;
  announcementQueue=announcementQueue.filter(event=>event.expires>elapsed);
  const next=announcementQueue.shift();
  if(next)showAnnouncement(next);
  else{
    currentAnnouncement=null;
    $('arcade-fx').classList.remove('show');
  }
}
function resetAnnouncements(){

function updateCityPhase(){
  if(cityCycleStart!==null){
    const time=(elapsed-cityCycleStart)%CITY_CYCLE_MS;
    let stop=1;
    while(CITY_CYCLE_STOPS[stop][0]<=time)stop++;
    const [fromTime,from]=CITY_CYCLE_STOPS[stop-1];
    const [toTime,to]=CITY_CYCLE_STOPS[stop];
    const ratio=(time-fromTime)/(toTime-fromTime);
    const ease=ratio*ratio*(3-2*ratio);
    cityMix.fill(0);
    cityMix[from]=1-ease;
    cityMix[to]+=ease;
    cityPhase=from;
    return;
  }
  let phase=cityPhase;
  while(phase+1<CITY_SCORE_PHASE_COUNT&&score>=CITY_PHASES[phase+1].score)phase++;
  if(phase!==cityPhase){
    cityFrom=cityMix.slice();
    cityPhase=phase;
    phaseStarted=elapsed;
  }
  const ratio=Math.min(1,(elapsed-phaseStarted)/CITY_TRANSITION_MS);
  const ease=ratio*ratio*(3-2*ratio);
  for(let i=0;i<cityMix.length;i++)cityMix[i]=cityFrom[i]*(1-ease)+(i===cityPhase?ease:0);
  if(cityPhase===CITY_SCORE_PHASE_COUNT-1&&ratio===1)cityCycleStart=phaseStarted+CITY_TRANSITION_MS;
}

function burst(cells,color,intensity){
  const {cell,left,top,particles}=scene;
  let cursor=0;
  for(const [x,y] of cells){
    for(let i=0;i<intensity+2;i++){
      while(cursor<particles.length&&particles[cursor].visible)cursor++;
      if(cursor===particles.length)return;
      const p=particles[cursor++];
      const angle=Math.random()*Math.PI*2;
      const distance=cell*(reducedMotion.matches?.18+Math.random()*.26:.31+Math.random()*.83);
      const cx=left+(x+.5)*cell,cy=top+(y+.5)*cell;
      p.setPosition(cx,cy).setFillStyle(color).setAlpha(1)
        .setScale((i===0&&intensity>=2?2.2:.72)+Math.random(),i===0?.46:.85).setRotation(angle).setVisible(true);
      scene.tweens.add({targets:p,x:cx+Math.cos(angle)*distance,y:cy+Math.sin(angle)*distance,
        alpha:0,scale:0,duration:150+Math.random()*110,onComplete:()=>p.setVisible(false)});
    }
  }
}

function changePressure(amount){
  pressure=Math.max(0,Math.min(100,pressure+amount));
  if(pressure===100){
    finish();
    return;
  }
  if(pressure>=82&&!critical){
    critical=true;
    cue('critical');
    flash('CRITICAL PRESSURE','critical');
  }
  if(pressure<74)critical=false;
}
function findGroup(x,y,seen){
  const color=board[y][x], stack=[[x,y]], group=[];
  while(stack.length){
    const [a,b]=stack.pop(), key=b*N+a;
    if(a<0||a>=N||b<0||b>=N||seen.has(key)||board[b][a]!==color)continue;
    seen.add(key);
    group.push([a,b]);
    stack.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
  }
  return group;
}
// Label the connected components before each wave. Labels fall with their crystals.
function labelComponents(){
  const labels=Array.from({length:N},()=>Array(N).fill(0));
  const seen=new Set();
  let label=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(seen.has(y*N+x))continue;
    label++;
    for(const [a,b] of findGroup(x,y,seen))labels[b][a]=label;
  }
  return labels;
}
function collapse(groups,intensity=1){
  const labels=labelComponents();
  const columns=new Set(), moved=[];
  for(const group of groups){
    const [x,y]=group[0];
    burst(group,C[board[y][x]],intensity);
    for(const [a,b] of group){
      board[b][a]=-1;
      columns.add(a);
    }
  }
  for(const x of columns){
    let destination=N-1;
    for(let y=N-1;y>=0;y--){
      if(board[y][x]<0)continue;
      board[destination][x]=board[y][x];
      labels[destination][x]=labels[y][x];
      if(destination!==y)moved.push([x,destination,y]);
      destination--;
    }
    for(let y=destination;y>=0;y--){
      board[y][x]=rand();
      labels[y][x]=0;
      moved.push([x,y,y-destination-1]);
    }
  }
  paintBoard(moved);
  return {labels,moved};
}
function chainGroups({labels,moved}){
  const seen=new Set(), groups=[];
  for(const [x,y] of moved){
    if(seen.has(y*N+x))continue;
    const group=findGroup(x,y,seen);
    if(group.length<CHAIN_MIN)continue;
    const first=labels[y][x];
    if(first===0||group.some(([a,b])=>labels[b][a]!==first))groups.push(group);
  }
  return groups;

function passivePressureBetween(fromMs,toMs){
  // Integrate the linear ramp, then accumulate at the capped rate.
  const rampFrom=Math.min(fromMs,PRESSURE.rampMs);
  const rampTo=Math.min(toMs,PRESSURE.rampMs);
  const averageRampFraction=(rampFrom+rampTo)/(2*PRESSURE.rampMs);
  const averageRampRate=PRESSURE.passiveStartPerSecond+
    (PRESSURE.passiveMaxPerSecond-PRESSURE.passiveStartPerSecond)*averageRampFraction;
  return (averageRampRate*(rampTo-rampFrom)+PRESSURE.passiveMaxPerSecond*(toMs-fromMs-rampTo+rampFrom))/1000;
}
function latePressureTarget(points){
  const fraction=(points-PRESSURE.lateScoreStart)/(PRESSURE.lateScoreCap-PRESSURE.lateScoreStart);
  return PRESSURE.lateMaxBonusPerSecond*Math.max(0,Math.min(1,fraction));
}
function latePressureFor(delta){
  // Ease toward the score-based bonus so even a large clear cannot jump the pressure rate.
  const target=latePressureTarget(score)*Math.min(1,elapsed/PRESSURE.rampMs);
  const previous=latePressureBonus;
  if(target===0&&previous===0)return 0;
  const response=PRESSURE.lateRateResponseMs;
  const blend=-Math.expm1(-delta/response);
  latePressureBonus=previous+(target-previous)*blend;
  // Integrate the easing curve over the frame.
  return (target*delta+(previous-target)*response*blend)/1000;
}
function pressureForGroup(size){
  if(size<PRESSURE.largeGroupMinSize)return PRESSURE.manualBySize[size];

  return -Math.min(PRESSURE.maxGroupCooling,PRESSURE.largeGroupBaseCooling+extra*PRESSURE.extraGemCooling);
}
function comboPoints(size){
  const base=10*size*size;
  const steps=Math.min(combo-1,5);
  return base+Math.floor(base*steps*Math.min(size-1,5)/25);
}
function updateCombo(size){
  if(elapsed-lastMove>=COMBO_MS){
    combo=0;
    qualityMoves=0;
    comboTier=0;
  }
  combo=Math.min(combo+1,12);

  if(size>=4)qualityMoves++;

    return;
  }
  busy=true;

  const previousScore=score;

  if(!playing)return;
  if(reward===3){
    flash('MEGA!'+(size>=5?' · +'+(score-previousScore).toLocaleString('en-US'):''),'mega');
    cue('mega');
  }else if(reward===2){
    flash('SUPER!'+(size>=5?' · +'+(score-previousScore).toLocaleString('en-US'):''),'super');
    cue('super');
  }else if(reward===1){
    flash('COMBO!'+(size>=5?' · +'+(score-previousScore).toLocaleString('en-US'):''),'combo');
    cue('combo');
  }else{
    if(size>=5)flash('+'+(score-previousScore).toLocaleString('en-US')+' PTS','clear');
    cue(size>=5?'large':'clear');

  if(size>=5||reward>0)cityImpact=Math.max(cityImpact,reward>=2?.87:size>=5?.63:.36);
  if(navigator.vibrate&&(size>=5||reward>=2))navigator.vibrate(reward===3?35:12);

  if(!reducedMotion.matches&&(reward>=2||size>=7))scene.cameras.main.shake(85,reward===3?.0026:.0014);

        promenade.fillCircle(x,y-height,1+t*1.3);
      }
    }
    this.paintBeachLife();
  }
  paintBeachLife(){
    const {w,h,beachLife:g,beachPathStart:foot}=this;
    g.clear();
    const height=h-foot;
    if(height<64)return;
    const parasols=[[.51,.31,0xff709d],[.52,.54,0x77fff0],[.36,.76,0xffcf7b]];
    for(const [horizontal,depth,color] of parasols){
      const x=w*horizontal,y=foot+height*depth;
      const size=Math.min(14,w*.037)*(0.77+depth*.49);
      g.fillStyle(0x221736,.25);
      g.fillEllipse(x+size*.4,y+size*.6,size*2.1,size*.50);
      g.lineStyle(1.3,0x7c5169,1);
      g.lineBetween(x,y+size*.53,x,y-size*.45);
      g.fillStyle(color,1);
      g.fillTriangle(x-size,y,x,y-size*.51,x+size,y);
      g.fillStyle(0xffedd8,.67);
      g.fillTriangle(x-size*.58,y,x,y-size*.51,x+size*.12,y);
      g.fillStyle(0xaf627a,.64);
      g.fillEllipse(x,y,size*2,size*.16);
      g.fillStyle(0x32334a,.82);
      g.fillRoundedRect(x+size*.53,y+size*.48,size*.71,size*.18,2);
      g.fillStyle(0xb47474,1);
      g.fillCircle(x+size*.64,y+size*.46,size*.13);
    }
    for(let i=0;i<4;i++){
      const depth=.28+i*.19, x=w*(.77-.21*depth)+6, y=foot+height*depth;
      g.fillStyle(i%2?0x604166:0xeeae8a,.65);
      g.fillRoundedRect(x,y,6+depth*6,2+depth*2,1);
    }
  }
  paintSideCity(){
    const {w,h,left,top,cell,sideCity:g,sideLights:lights}=this;
    const edge=Math.max(8,Math.min(left-3,w-(left+cell*N)-3,185));
    const boardBottom=top+cell*N;
    g.clear();
    lights.clear();
    for(const side of [-1,1]){
      const x=distance=>side<0?distance:w-distance;
      const neon=side<0?0xff5cbf:0x67fff0;
      const tint=side<0?0x9a5281:0x356e81;
      const amber=0xffa666;
      const rearRoof=top-Math.min(65,cell*1.75);
      const roof=top+Math.min(36,cell*.65);
      const foot=boardBottom-Math.min(38,cell*.63);
      const body=(layer,color,alpha,points)=>{
        layer.fillStyle(color,alpha);
        layer.fillPoints(points.map(([a,b])=>({x:x(a),y:b})),true);
      };
      body(g,0x38244e,1,[[0,rearRoof],[edge*.57,rearRoof+27],[edge*.99,foot],[0,foot+12]]);
      body(g,0x805378,1,[[0,rearRoof],[edge*.49,rearRoof+24],[edge*.54,roof+21],[0,roof+12]]);
      for(let i=0;i<3;i++){
        const y=rearRoof+20+i*12;
        body(lights,amber,.4,[[edge*.08,y],[edge*.33,y+6],[edge*.33,y+9],[edge*.08,y+3]]);
      }
      body(g,0x120e27,1,[[0,roof-19],[edge*.94,roof+20],[edge*1.27,foot-9],[0,foot+38]]);
      body(g,tint,1,[[0,roof],[edge*.74,roof+22],[edge*.74,foot],[0,foot+22]]);
      body(g,0x30264d,1,[[edge*.74,roof+22],[edge*1.27,roof+43],[edge*1.27,foot-15],[edge*.74,foot]]);
      body(g,0xd68aa9,.4,[[0,roof],[edge*.74,roof+22],[edge*.49,roof+32],[0,roof+14]]);
      body(g,0x170f27,.44,[[edge*.49,roof+33],[edge*.74,roof+40],[edge*.74,foot],[edge*.42,foot+8]]);
      g.lineStyle(3,neon,.21);
      g.lineBetween(x(edge*.74),roof+22,x(edge*.74),foot);
      g.lineStyle(1,amber,.65);
      g.lineBetween(x(0),roof+9,x(edge*.64),roof+28);
      body(g,0x462346,1,[[0,roof-10],[edge*.74,roof+16],[edge*.74,roof+29],[0,roof+8]]);
      for(let row=0;row<5;row++){
        const y=roof+44+(foot-roof-53)*row/5;
        const height=Math.min(23,Math.max(6,(foot-roof)*.07));
        for(let col=0;col<2;col++){
          const a=edge*(.04+.33*col), b=a+edge*.23;
          body(g,0x17142d,1,[[a,y],[b,y+4],[b,y+height+4],[a,y+height]]);
          body(lights,row%2===0?0xffd39c:neon,.86,[[a+2,y+2],[b-2,y+5],[b-2,y+height],[a+2,y+height-2]]);
          lights.lineStyle(.8,0xffedf6,.55);
          lights.lineBetween(x(a+2),y+2,x(b-2),y+5);
        }
        g.lineStyle(1,0xeeb4d7,.4);
        g.lineBetween(x(0),y+height+3,x(edge*.74),y+height+13);
      }
      const signX=x(edge*.42), signY=roof+Math.min(59,cell*1.04);
      g.fillStyle(0x171026,1);
      g.fillRoundedRect(signX-6,signY-10,12,65,4);
      g.lineStyle(9,neon,.19);
      g.strokeRoundedRect(signX-6,signY-10,12,65,4);
      g.lineStyle(5,neon,.21);
      g.strokeRoundedRect(signX-6,signY-10,12,65,4);
      g.lineStyle(1,neon,.94);
      g.strokeRoundedRect(signX-6,signY-10,12,65,4);
      const label=side<0?'O\nC\nE\nA\nN':'L\nU\nN\nA';
      this.signs.push(this.add.text(signX,signY-3,label,{
        fontFamily:'monospace',fontSize:9,fontStyle:'bold',
        color:side<0?'#ffd3ec':'#cafff5',align:'center',lineSpacing:-1
      }).setOrigin(.5,0).setDepth(-5.2).setShadow(0,0,side<0?'#ff429d':'#45e7d6',6));
      lights.lineStyle(5,neon,.27);
      lights.lineBetween(x(edge*.74),roof+24,x(edge*.74),foot-5);
      lights.lineStyle(1,neon,.78);
      lights.lineBetween(x(edge*.74),roof+26,x(edge*.74),foot-5);
      g.lineStyle(3,neon,.25);
      g.lineBetween(x(0),foot+23,x(edge*.74),foot+1);
      for(let i=0;i<9;i++){
        const y=foot+30+i*6;
        g.fillStyle(neon,.16-i*.014);
        g.fillEllipse(x(edge*(.25+(i%3)*.22)),Math.min(h-2,y),9+i*2,2);
      }
    }
  }
  paintStreetGlow(){
    const {streetGlow:g,w,h,top,cell,left}=this;
    const start=top+cell*N+16;
    g.clear();
    for(const side of [-1,1]){
      const rail=side<0?left:w-left;
      for(let i=0;i<16;i++){
        const y=start+8+i*8;
        if(y>h-8)break;
        const x=rail+side*(15+(i*29)%47);
        const color=i%3===0?0xffa26e:side<0?0xff56a8:0x51edda;
        g.fillStyle(color,.14*(1-i/17));
        g.fillEllipse(x,y,39+i*4,6);
        g.fillStyle(color,.45*(1-i/17));
        g.fillEllipse(x+side*5,y,18+i*3,2);
        if(i%3===0){
          g.lineStyle(.75,0xffe7f0,.38*(1-i/17));
          g.lineBetween(x-5,y,x+12+i,y);
        }
      }
    }
  }
  paintGlass(){
    const {glass,left,top,cell}=this;
    const span=cell*N;
    glass.clear();
    glass.fillStyle(0xb8eefe,.13);
    glass.fillPoints([{x:left,y:top+4},{x:left+span*.52,y:top+4},
      {x:left+span*.26,y:top+span-4},{x:left,y:top+span-4}],true);
    glass.lineStyle(1,0xf8dbff,.6);
    glass.lineBetween(left+10,top-4,left+span*.69,top-4);
    glass.lineStyle(1,0x92fff0,.58);
    glass.lineBetween(left+span*.36,top+span+4,left+span-10,top+span+4);
  }
  hotel(x,base,width,height,pastel,neon,name){
    const g=this.city, y=base-height;
    g.fillStyle(0x231631,.65);
    g.fillRoundedRect(x+4,y+5,width,height,7);
    g.fillStyle(pastel,1);
    g.fillRoundedRect(x,y+9,width,height-9,6);
    g.fillRoundedRect(x+width*.32,y,width*.36,height,6);
    g.fillStyle(0x785179,.68);
    g.fillRect(x,y+height*.77,width,height*.23);
    this.cityWindows.lineStyle(8,neon,.24);
    this.cityWindows.lineBetween(x+2,y+height*.19,x+2,y+height*.72);
    this.cityWindows.lineBetween(x+width-3,y+height*.20,x+width-3,y+height*.72);
    this.cityWindows.lineStyle(6,neon,.28);
    this.cityWindows.lineBetween(x+5,y+12,x+width-5,y+12);
    this.cityWindows.lineBetween(x+5,y+height*.76,x+width-5,y+height*.76);
    this.cityWindows.lineStyle(1,0xffe8de,.84);
    this.cityWindows.lineBetween(x+6,y+11,x+width-6,y+11);
    this.cityWindows.lineStyle(1,neon,.91);
    this.cityWindows.lineBetween(x+2,y+height*.20,x+2,y+height*.72);
    this.cityWindows.lineBetween(x+width-3,y+height*.20,x+width-3,y+height*.72);
    g.lineStyle(2,neon,1);
    g.lineBetween(x+3,y+12,x+width-3,y+12);
    g.lineBetween(x+3,y+height*.76,x+width-3,y+height*.76);
    for(let row=0;row<3;row++)for(let col=0;col<5;col++){
      const wx=x+width*(.11+.17*col), wy=y+height*(.26+row*.16);
      g.fillStyle(0x352443,1);
      g.fillRoundedRect(wx,wy,width*.10,height*.095,2);
      g.fillStyle((row+col)%3===0?0xffd3a5:neon,.59);
      g.fillRect(wx+1,wy+1,width*.06,height*.045);
    }
    this.cityShade.fillStyle(0x110d2a,.76);
    this.cityShade.fillRoundedRect(x,y+9,width,height-9,6);
    for(let row=0;row<3;row++)for(let col=0;col<5;col++){
      const color=(row+col)%3===0?0xffb274:neon;
      this.cityWindows.fillStyle(color,.36);
      const wx=x+width*(.11+.17*col),wy=y+height*(.26+row*.16);
      this.cityWindows.fillRoundedRect(wx,wy,width*.10,height*.095,2);
      this.cityWindows.fillStyle(0xfff2dd,.62);
      this.cityWindows.fillRect(wx+1,wy+1,width*.064,1);
    }
    const sign=this.add.text(x+width*.5,y+height*.84,name,{fontFamily:'monospace',
      fontSize:Math.max(8,Math.floor(width*.12)),fontStyle:'bold',color:name==='PALOMA'?'#fff1d0':'#e3fff8'});
    sign.setOrigin(.5).setDepth(-7).setShadow(0,0,name==='PALOMA'?'#ff7b43':'#62e8d5',6);
    this.signs.push(sign);
  }
  drawPalm(g,i,horizon){
    const far=i<2, side=i%2===0?1:-1, scale=far?.55:1;
    const x=this.w*(i===0?.27:i===1?.74:i===2?.02:.98);
    const y=horizon+(far?51:103);
    g.clear();
    g.setPosition(x,y).setScale(scale);
    g.lineStyle(far?5:8,far?0x372042:0x19142e,1);
    g.beginPath();
    g.moveTo(0,0);
    g.lineTo(side*9,-37);
    g.lineTo(side*24,-85);
    g.strokePath();
    for(let k=0;k<5;k++){
      const y=-13-k*13, x=side*(k*3+3);
      g.lineStyle(.85,far?0x815375:0x835478,.58);
      g.lineBetween(x-3,y,x+3,y-2);
    }
    g.lineStyle(1,far?0x966382:0x76527f,.65);
    g.lineBetween(side*1,-7,side*9,-37);
    g.lineBetween(side*9,-37,side*24,-85);
    g.fillStyle(far?0x472750:0x1c1835,1);
    for(let j=0;j<7;j++){
      const angle=-Math.PI+j*Math.PI/6, length=30+(j%3)*8;
      const dx=Math.cos(angle)*length,dy=Math.sin(angle)*length;
      g.fillPoints([{x:side*24,y:-85},{x:side*24+dx*.57,y:-92+dy*.55},
        {x:side*24+dx,y:-76+dy},{x:side*24+dx*.54,y:-81+dy*.56}],true);
      g.lineStyle(.8,far?0xd08cb5:0x9b6799,.42);
      g.lineBetween(side*24,-85,side*24+dx*.91,-78+dy*.94);
    }
  }
  paintReactorFX(){
    const {left:x,top:y,cell,edgeElectric:e,edgeDanger:d,neonSpill:n,warmSpill:w,lightSweep:l}=this;
    const span=cell*N;
    const right=x+span, bottom=y+span;
    e.clear();
    d.clear();
    n.clear();
    w.clear();
    l.clear();
    d.lineStyle(5,0xff632f,.22);
    d.strokeRoundedRect(x-9,y-9,span+18,span+18,15);
    d.lineStyle(1,0xff8a63,.88);
    d.strokeRoundedRect(x-7,y-7,span+14,span+14,12);
    for(const [edge,sign,color] of [[x,-1,0x77fff5],[right,1,0xff73cb]]){
      w.fillStyle(0xff6532,.25);
      w.fillPoints([{x:edge,y:y+span*.24},{x:edge+sign*29,y:y+span*.45},
        {x:edge+sign*16,y:bottom+56},{x:edge,y:bottom+25}],true);
      n.fillStyle(color,.28);
      n.fillPoints([{x:edge,y:y+6},{x:edge+sign*23,y:y+span*.33},{x:edge+sign*9,y:bottom},{x:edge,y:bottom-5}],true);
      e.lineStyle(5,color,.21);
      e.lineBetween(edge+sign*7,y+9,edge+sign*7,bottom-9);
      e.lineStyle(1.5,color,1);
      e.strokePoints([{x:edge,y:y-6},{x:edge+sign*7,y:y+12},{x:edge+sign*4,y:y+span*.27},
        {x:edge+sign*10,y:y+span*.38},{x:edge+sign*6,y:y+span*.67},
        {x:edge+sign*9,y:bottom-13},{x:edge,y:bottom+7}]);
    }
    l.fillStyle(0xffb29c,.12);
    l.fillEllipse(0,this.h*.36,75,4);
    l.fillStyle(0x83fdff,.14);
    l.fillEllipse(-15,this.h*.36+7,112,3);
  }
  animateCity(time){
    let coverage=0,sun=0,lights=0,night=0,reflection=0,depth=0,halo=0,sunDrop=0;
    for(let i=0;i<CITY_PHASES.length;i++){
      const weight=cityMix[i], phase=CITY_PHASES[i];
      coverage+=weight;
      const opacity=coverage?weight/coverage:0;
      this.skies[i].setVisible(weight>.001).setAlpha(opacity);
      this.coasts[i].setVisible(weight>.001).setAlpha(opacity);
      sunDrop+=weight*phase.sunDrop;
      sun+=weight*phase.sun;
      lights+=weight*phase.lights;
      night+=weight*phase.night;
      reflection+=weight*phase.reflection;
      depth+=weight*phase.depth;
      halo+=weight*phase.halo;
    }
    this.sun.setAlpha(sun*(.94+.06*Math.sin(time/1600)));
    this.stars.setAlpha(.13+night);
    this.cityShade.setAlpha(night);
    const subdued=reducedMotion.matches;
    const active=playing&&elapsed<overUntil;
    const impact=subdued?0:cityImpact;
    const danger=playing?Math.max(0,(pressure-60)/40):0;
    const sway=subdued?0:Math.sin(time/3400);
    this.edgeDanger.setAlpha(danger*.79);
    for(let i=0;i<2;i++){
      const tint=phaseGlow(i);
      if(tint!==this.cockpitColors[i]){
        this.cockpitColors[i]=tint;
        const color='#'+tint.toString(16).padStart(6,'0');
        this.cockpit.style.setProperty(i===0?'--cockpit-warm':'--cockpit-cool',color);
      }
      this.halos[i].setTint(tint).setAlpha(halo+.10+impact*.18+(active?.13:0));
      this.halos[i+2].setTint(tint).setAlpha((halo+.08+impact*.21)*reflection+(active?.15:0));
      const sweep=(time*.014+i*this.w*.57)%(this.w+120);
      this.beams[i].setVisible(!subdued).setTint(tint)
        .setPosition(i===0?sweep-60:this.w+60-sweep,this.horizon-9+i*20)
        .setRotation(i===0?-.16:.14).setAlpha(.22+night*.22+impact*.17);
    }
    this.warmSpill.setAlpha(danger*.82);
    this.edgeElectric.setAlpha(active?(subdued?.62:.77+.09*Math.sin(time/310)):impact*.79);
    this.neonSpill.setAlpha(active?.87:impact*.58);
    this.lightSweep.setVisible(!subdued).setX(time*.025%(this.w+135)-65).setAlpha(.59+impact*.31);
    this.cityWindows.setAlpha(Math.min(1,lights*(.80+(subdued?0:.12*Math.sin(time/1260)))+night*.21+impact*.35+(active?.16:0)));
    this.sideLights.setAlpha(Math.min(1,lights*(.82+(subdued?0:.18*Math.sin(time/1020)))+impact*.29+(active?.19:0)));
    this.streetGlow.setAlpha(Math.min(1,reflection*(.82+(subdued?0:.17*Math.sin(time/1420)))+impact*.34+(active?.17:0)));
    this.sun.setPosition(depth*2.6*sway,this.sunRadius*sunDrop);
    this.surf.setPosition(subdued?0:Math.sin(time/2300)*4,subdued?0:Math.sin(time/3200)*2)
      .setAlpha(.64+night*.26+(subdued?0:.07*Math.sin(time/1850)));
    this.beachLife.setAlpha(1-night*.44);
    const waterfront=this.h-this.beachPathStart;
    this.walkers.forEach((walker,i)=>{
      const progress=subdued?(i+1)/5:(time/(13000+i*2200)+i*.27)%1;
      const depth=i%2===0?progress:1-progress;
      const scale=.38+depth*.48;
      const direction=i%2===0?-1:1;
      walker.setVisible(waterfront>=64)
        .setPosition(this.w*(.79-.21*depth)+(i%2)*17,this.beachPathStart+waterfront*(.12+.72*depth))
        .setScale(scale*direction,scale)
        .setAlpha((1-night*.37)*Math.min(1,progress*8,(1-progress)*8));
      const step=subdued?0:Math.floor((time+i*83)/180)%2;
      if(walker.texture.key!=='beach-step-'+step)walker.setTexture('beach-step-'+step);
    });
    this.city.setX(depth*1.2*sway);
    this.cityShade.setX(this.city.x);
    this.cityWindows.setX(this.city.x);
    this.glass.setAlpha(.42+(subdued?0:.15*Math.sin(time/1950))+impact*.23);
    this.palms.forEach((p,i)=>p.setRotation((subdued?0:Math.sin(time/1900+i))*.025*depth));
    this.traffic.forEach((car,i)=>{
      const travel=(time*(i===0?.043:.036)+i*this.w*.47)%(this.w+115);
      car.setPosition(i===0?travel-55:this.w+55-travel,this.horizon+46+i*8)
        .setVisible((i===0?travel-55:this.w+55-travel)>this.w*.69);
    });
    this.signs.forEach((sign,i)=>sign.setAlpha(Math.min(1,lights*(.93+(subdued?0:.07*Math.sin(time/960+i)))+impact*.4+(active?.15:0))).setX(sign.homeX+1.5*sway));
  }
}
const reactor=new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#130c2d',scale:{mode:Phaser.Scale.NONE,width:innerWidth,height:innerHeight},scene:[Game]});
function resizeGame(){
  const viewport=window.visualViewport;
  const width=innerWidth;
  const height=viewport&&viewport.scale===1?Math.round(viewport.height):innerHeight;
  if(reactor.scale?.canvas&&(reactor.scale.width!==width||reactor.scale.height!==height)){
    reactor.scale.resize(width,height);
  }
}
window.addEventListener('resize',resizeGame);
window.visualViewport?.addEventListener('resize',resizeGame);
$('start').onclick=()=>{$('overlay').hidden=true;start()};
$('music-toggle').onclick=()=>{
  musicEnabled=!musicEnabled;
  $('music-toggle').setAttribute('aria-pressed',String(musicEnabled));
  syncMusic(true);
};
$('effects-toggle').onclick=()=>{
  effectsEnabled=!effectsEnabled;
  $('effects-toggle').setAttribute('aria-pressed',String(effectsEnabled));
  if(effectsEnabled)unlockEffects();
  else if(effectsBus)effectsBus.gain.setTargetAtTime(0,audio.currentTime,.026);
};
window.addEventListener('visibilitychange',()=>{
  syncMusic();
  if(document.hidden)setTension(0);
});
window.addEventListener('pagehide',()=>musicTrack?.pause());
window.addEventListener('pageshow',()=>syncMusic());
window.addEventListener('pointerdown',event=>{
  if(!playing||event.target.closest?.('button'))return;
  if(effectsEnabled&&audio?.state!=='running')unlockEffects();
  if(musicTrack?.paused&&musicEnabled&&!musicFailed)syncMusic(true);
},true);

})();
